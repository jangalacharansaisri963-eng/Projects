name: Extract Retro-Arcade Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  extract-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and clean up archive
        run: |
          cd "JavaScript"
          
          if [ -f "retro-arcade-game-engine.zip" ]; then
            echo "Extracting retro-arcade-game-engine.zip..."
            mkdir -p temp_engine
            unzip -q "retro-arcade-game-engine.zip" -d temp_engine
            
            mkdir -p retro-arcade-game-engine
            
            if [ -d "temp_engine/retro-arcade-game-engine" ]; then
              cp -r temp_engine/retro-arcade-game-engine/* retro-arcade-game-engine/
            else
              cp -r temp_engine/* retro-arcade-game-engine/
            fi
            
            rm -rf temp_engine
            rm "retro-arcade-game-engine.zip"
            echo "Done."
          else
            echo "No zip found in JavaScript/"
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Extract retro-arcade-game-engine zip into folder and clean up"
          branch: main
