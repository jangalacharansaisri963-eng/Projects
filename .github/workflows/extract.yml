name: Extract PyScript-Calc Zip

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  extract-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract zip and clean up archive
        run: |
          cd "JavaScript"
          
          if [ -f "PyScript-Calc.zip" ]; then
            echo "Extracting PyScript-Calc.zip..."
            mkdir -p temp_calc
            unzip -q "PyScript-Calc.zip" -d temp_calc
            
            mkdir -p PyScript-Calc
            
            if [ -d "temp_calc/PyScript-Calc" ]; then
              cp -r temp_calc/PyScript-Calc/* PyScript-Calc/
            else
              cp -r temp_calc/* PyScript-Calc/
            fi
            
            rm -rf temp_calc
            rm "PyScript-Calc.zip"
            echo "Done."
          else
            echo "No zip found in JavaScript/"
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Extract PyScript-Calc zip into folder and clean up"
          branch: main
