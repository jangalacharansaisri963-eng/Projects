name: Extract Zip in Folder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Zip File in Path
        run: |
          # Navigate into the target directory
          cd JavaScript/PyScript-Calc/
          
          # Unzip into a temp folder inside it
          unzip -o pyscript-calculator.zip -d temp_extracted/
          
          # Move contents out of temp folder to the current directory
          cp -r temp_extracted/* ./
          
          # Remove the temp folder
          rm -rf temp_extracted
          
          # Optional: remove the zip file itself after extraction if you don't want it sitting there
          # rm pyscript-calculator.zip

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-extract zip inside JavaScript/PyScript-Calc" && git push origin main)
          
