name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: JavaScript/Match-Emoji/package.json

      - name: Install dependencies & Build
        run: |
          if [ -d "JavaScript/Match-Emoji" ] && [ -f "JavaScript/Match-Emoji/package.json" ]; then
            echo "Building from JavaScript/Match-Emoji/ subfolder..."
            cd JavaScript/Match-Emoji
            npm install
            npm run build
          else
            echo "Error: JavaScript/Match-Emoji directory or package.json not found!"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'JavaScript/Match-Emoji/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
