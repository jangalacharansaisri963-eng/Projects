name: Generate and Push Electors List Excel

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Run Python script
        run: python Excels/Pandas/Basics/electors_list.py

      - name: Commit and push Excel file automatically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add Excels/Pandas/Basics/electors_list.xlsx
          
          if git diff --staged --quiet; then
            echo "No changes to commit – Excel file is already up to date."
          else
            git commit -m "chore: auto-update electors_list.xlsx [skip ci]"
            git push origin main
            echo "Successfully pushed updated Excel file to main branch."
          fi

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: electors-list-excel
          path: Excels/Pandas/Basics/electors_list.xlsx
          
