name: Generate Electors List Excel

on:
  workflow_dispatch:          # Manual trigger from Actions tab
  push:
    branches: [main]
    paths:
      - 'Excels/Pandas/Basics'
      - '.github/workflows/electors_list.yml'
      # Intentionally NOT watching the .xlsx so we avoid infinite loops

permissions:
  contents: write             # Required to push back to main

jobs:
  generate-and-push:
    name: Generate Excel → Push to main → Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Generate Electors List Excel
        run: |
          # Run the script directly from its correct folder path
          python Excels/Pandas/Basics/generate_electors_list.py
          
          # Just to be 100% sure the folder and file exist right where they belong
          ls -lh Excels/Pandas/Basics/electors_list_combined.xlsx

      - name: Commit and push Excel to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Excels/Pandas/Basics/electors_list_combined.xlsx

          # Only commit if the file actually changed
          if git diff --staged --quiet; then
            echo "No changes to commit – Excel is already up to date."
          else
            git commit -m "chore: update electors_list_combined.xlsx [skip ci]"
            git push origin main
            echo "Excel file successfully pushed to main branch."
          fi

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: electors-list-excel
          path: Excels/Pandas/Basics/electors_list_combined.xlsx
          retention-days: 30
          if-no-files-found: error

      - name: Summary
        run: |
          echo "### Electors List Excel generated & pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **File on main:** \`Excels/Pandas/Basics/electors_list_combined.xlsx\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Total Electors:** 161" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** available for download from this run" >> $GITHUB_STEP_SUMMARY
          ls -lh Excels/Pandas/Basics/electors_list_combined.xlsx >> $GITHUB_STEP_SUMMARY
          
