name: Generate Electors Excel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Add explicit write permissions for the workflow
permissions:
  contents: write

jobs:
    run-electors-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Run Electors List Script
        run: |
          python electors_list.py
        working-directory: Excels/Passdas/Basics/ # Make sure this matches your path

      - name: Commit and Push Excel Output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated Excel file from electors_list.py"
          file_pattern: 'Excels/Pandas/Basics/*.xlsx'
        env:
          # Explicitly pass the GitHub token to authenticate the push
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
