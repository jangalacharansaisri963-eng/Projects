name: Generate Electors Excel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-electors-script:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Install required libraries
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      # 4. Run electors_list.py from its specific directory
      - name: Run Electors List Script
        run: |
          python electors_list.py
        working-directory: Excels/Pandas/Basics/

      # 5. Automatically save any generated Excel files back to the repository
      - name: Commit and Push Excel Output
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generated Excel file from electors_list.py"
          file_pattern: 'Excels/Pandas/Basics/*.xlsx'
          
