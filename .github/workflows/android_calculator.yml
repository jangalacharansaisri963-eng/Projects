name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout your repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java Development Kit (Required for Android/Kotlin builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 3. Grant execute permissions to Gradle wrapper inside the Kotlin folder
      - name: Grant execute permission for gradlew
        working-directory: ./Kotlin
        run: chmod +x gradlew

      # 4. Compile and build the Debug APK
      - name: Build Debug APK with Gradle
        working-directory: ./Kotlin
        run: ./gradlew assembleDebug

      # 5. Upload the generated APK so you can download it from GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: Kotlin/app/build/outputs/apk/debug/*.apk
          
