name: Generate Electors Excel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas openpyxl

    - name: Run Python script
      working-directory: Excels/Pandas/Basics
      run: python electors_list2.py

    - name: Upload Excel file as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: electors-list-excel
        path: Excels/Pandas/Basics/*.xlsx
        
