<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Chess Pro</title>
    
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #262421;
            color: #bababa;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 10px;
            box-sizing: border-box;
        }
        h1 { color: #fff; text-align: center; font-size: 22px; margin: 10px 0; }
        #myBoard {
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            border: 2px solid #403d39;
        }
        .controls {
            background-color: #312e2b;
            padding: 15px;
            margin-top: 15px;
            border-radius: 8px;
        }
        .status-bar {
            background: #45423e;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
            color: #95bb4a;
            margin-bottom: 15px;
            min-height: 20px;
        }
        .setting-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        label { font-size: 14px; color: #fff; }
        select, button {
            padding: 10px;
            border-radius: 4px;
            border: none;
            font-size: 14px;
            background: #403d39;
            color: white;
        }
        select { width: 60%; }
        button {
            width: 100%;
            background-color: #95bb4a;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:active { background-color: #7fa33c; }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI Chess Master</h1>
        
        <div class="status-bar" id="status">White to move</div>

        <div id="myBoard"></div>

        <div class="controls">
            <div class="setting-group">
                <label>Play As:</label>
                <select id="userColor">
                    <option value="w">White</option>
                    <option value="b">Black</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Opponent:</label>
                <select id="mode">
                    <option value="robot">Robot (AI)</option>
                    <option value="pvp">Two Player</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Difficulty:</label>
                <select id="difficulty">
                    <option value="0">Easy</option>
                    <option value="1">Medium</option>
                    <option value="2">Hard</option>
                    <option value="3">Unbeatable</option>
                </select>
            </div>

            <button onclick="resetGame()">Start New Game</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        // AI Settings
        var weights = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };
        
        function evaluateBoard(game) {
            var total = 0;
            game.board().forEach(row => {
                row.forEach(piece => {
                    if (piece) {
                        var val = weights[piece.type];
                        total += (piece.color === 'w' ? val : -val);
                    }
                });
            });
            return total;
        }

        function minimax(depth, game, alpha, beta, isMax) {
            if (depth === 0) return -evaluateBoard(game);
            var moves = game.moves();
            if (isMax) {
                var best = -9999;
                for (var i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    best = Math.max(best, minimax(depth - 1, game, alpha, beta, !isMax));
                    game.undo();
                    alpha = Math.max(alpha, best);
                    if (beta <= alpha) return best;
                }
                return best;
            } else {
                var best = 9999;
                for (var i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    best = Math.min(best, minimax(depth - 1, game, alpha, beta, !isMax));
                    game.undo();
                    beta = Math.min(beta, best);
                    if (beta <= alpha) return best;
                }
                return best;
            }
        }

        function makeBestMove() {
            var moves = game.moves();
            if (game.game_over()) return;

            var diff = parseInt($('#difficulty').val());
            var selectedMove = null;

            if (diff === 0) {
                selectedMove = moves[Math.floor(Math.random() * moves.length)];
            } else {
                var depth = diff; 
                var isRobotWhite = (game.turn() === 'w');
                
                // If robot is White, it wants to maximize. If Black, minimize.
                var bestValue = isRobotWhite ? -9999 : 9999;

                for (var i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    var boardValue = minimax(depth, game, -10000, 10000, !isRobotWhite);
                    game.undo();
                    
                    if (isRobotWhite) {
                        if (boardValue > bestValue) { bestValue = boardValue; selectedMove = moves[i]; }
                    } else {
                        if (boardValue < bestValue) { bestValue = boardValue; selectedMove = moves[i]; }
                    }
                }
            }
            
            game.move(selectedMove || moves[0]);
            board.position(game.fen());
            updateStatus();
        }

        function onDragStart (source, piece, position, orientation) {
            if (game.game_over()) return false;
            
            var userCol = $('#userColor').val();
            var mode = $('#mode').val();

            if (mode === 'robot') {
                // Cannot move robot pieces
                if ((userCol === 'w' && piece.search(/^b/) !== -1) ||
                    (userCol === 'b' && piece.search(/^w/) !== -1)) return false;
            }
            
            // Cannot move if it's not that color's turn
            if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                (game.turn() === 'b' && piece.search(/^w/) !== -1)) return false;
        }

        function onDrop (source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';

            updateStatus();

            if ($('#mode').val() === 'robot' && !game.game_over()) {
                $status.html('Robot is thinking...');
                window.setTimeout(makeBestMove, 250);
            }
        }

        function updateStatus() {
            var status = '';
            var moveColor = (game.turn() === 'b') ? 'Black' : 'White';

            if (game.in_checkmate()) status = 'Checkmate! ' + moveColor + ' lost.';
            else if (game.in_draw()) status = 'Draw Game';
            else {
                status = moveColor + ' to move';
                if (game.in_check()) status += ' (CHECK)';
            }
            $status.html(status);
        }

        function resetGame() {
            game.reset();
            var userCol = $('#userColor').val();
            
            // Flip board based on choice
            board.orientation(userCol === 'w' ? 'white' : 'black');
            board.start();
            updateStatus();

            // If user is Black, Robot (White) moves first
            if (userCol === 'b' && $('#mode').val() === 'robot') {
                $status.html('Robot is thinking...');
                window.setTimeout(makeBestMove, 500);
            }
        }

        board = Chessboard('myBoard', {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
        });

        // Mobile Fix
        document.getElementById('myBoard').addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        updateStatus();
    </script>
</body>
</html>
