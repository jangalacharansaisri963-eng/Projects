<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: #162447;
            color: white;

            font-family: Arial, sans-serif;
            touch-action: manipulation;
        }

        h1 {
            margin: 0 0 10px;
        }

        #status {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .settings {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            font-family: inherit;
            touch-action: manipulation;
        }

        .option {
            padding: 9px 13px;

            border: none;
            border-radius: 7px;

            background: #1f4068;
            color: white;

            font-weight: bold;
            cursor: pointer;
        }

        .option.active {
            background: #056676;
        }

        #difficultyBox {
            display: none;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, 90px);
            gap: 8px;
        }

        .cell {
            width: 90px;
            height: 90px;

            border: none;
            border-radius: 10px;

            background: #1f4068;
            color: white;

            font-size: 42px;
            font-weight: bold;

            cursor: pointer;
            touch-action: manipulation;

            transition: transform 0.1s, background 0.1s;
        }

        .cell:active {
            transform: scale(0.94);
        }

        .cell.x {
            color: #ff4b5c;
        }

        .cell.o {
            color: #38bdf8;
        }

        #restart {
            margin-top: 20px;

            padding: 12px 25px;

            border: none;
            border-radius: 8px;

            background: #ff4b5c;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
            touch-action: manipulation;
        }

        #restart:active {
            transform: scale(0.95);
        }

        @media (max-width: 350px) {
            #board {
                grid-template-columns: repeat(3, 75px);
            }

            .cell {
                width: 75px;
                height: 75px;
                font-size: 34px;
            }
        }
    </style>
</head>

<body>

    <h1>❌ Tic Tac Toe ⭕</h1>

    <div id="status">Player X's Turn</div>

    <div class="settings">
        <button class="option active" id="twoPlayers">
            2 Players
        </button>

        <button class="option" id="robotMode">
            🤖 Robot
        </button>
    </div>

    <div class="settings" id="difficultyBox">
        <button class="option active" data-difficulty="easy">
            Easy
        </button>

        <button class="option" data-difficulty="medium">
            Medium
        </button>

        <button class="option" data-difficulty="hard">
            Hard
        </button>

        <button class="option" data-difficulty="unbeatable">
            Unbeatable
        </button>
    </div>

    <div class="settings" id="symbolBox">
        <button class="option active" id="chooseX">
            Play X
        </button>

        <button class="option" id="chooseO">
            Play O
        </button>
    </div>

    <div id="board">
        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>

        <button class="cell"></button>
        <button class="cell"></button>
        <button class="cell"></button>
    </div>

    <button id="restart">Restart</button>

    <script>
        const cells = document.querySelectorAll(".cell");

        const status = document.getElementById("status");

        const twoPlayers = document.getElementById("twoPlayers");
        const robotMode = document.getElementById("robotMode");

        const difficultyBox =
            document.getElementById("difficultyBox");

        const symbolBox =
            document.getElementById("symbolBox");

        const chooseX =
            document.getElementById("chooseX");

        const chooseO =
            document.getElementById("chooseO");

        const restart =
            document.getElementById("restart");

        let currentPlayer = "X";
        let gameActive = true;

        let gameMode = "pvp";
        let difficulty = "easy";

        let playerSymbol = "X";
        let robotSymbol = "O";

        let robotThinking = false;

        const winningPatterns = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]
        ];

        cells.forEach((cell, index) => {
            cell.addEventListener("click", () => {
                playerMove(index);
            });
        });

        twoPlayers.addEventListener("click", () => {
            gameMode = "pvp";

            twoPlayers.classList.add("active");
            robotMode.classList.remove("active");

            difficultyBox.style.display = "none";
            symbolBox.style.display = "flex";

            restartGame();
        });

        robotMode.addEventListener("click", () => {
            gameMode = "robot";

            robotMode.classList.add("active");
            twoPlayers.classList.remove("active");

            difficultyBox.style.display = "flex";
            symbolBox.style.display = "flex";

            restartGame();
        });

        document
            .querySelectorAll("[data-difficulty]")
            .forEach(button => {

                button.addEventListener("click", () => {

                    difficulty =
                        button.dataset.difficulty;

                    document
                        .querySelectorAll("[data-difficulty]")
                        .forEach(b =>
                            b.classList.remove("active")
                        );

                    button.classList.add("active");

                    restartGame();
                });
            });

        chooseX.addEventListener("click", () => {
            playerSymbol = "X";
            robotSymbol = "O";

            chooseX.classList.add("active");
            chooseO.classList.remove("active");

            restartGame();
        });

        chooseO.addEventListener("click", () => {
            playerSymbol = "O";
            robotSymbol = "X";

            chooseO.classList.add("active");
            chooseX.classList.remove("active");

            restartGame();
        });

        function playerMove(index) {

            if (!gameActive) {
                return;
            }

            if (cells[index].textContent !== "") {
                return;
            }

            if (gameMode === "robot") {

                if (currentPlayer !== playerSymbol) {
                    return;
                }

                if (robotThinking) {
                    return;
                }
            }

            makeMove(index, currentPlayer);

            if (
                gameActive &&
                gameMode === "robot" &&
                currentPlayer === robotSymbol
            ) {
                robotThinking = true;

                status.textContent = "Robot is thinking... 🤖";

                setTimeout(() => {
                    robotMove();
                }, 400);
            }
        }

        function makeMove(index, player) {

            cells[index].textContent = player;

            cells[index]
                .classList.add(player.toLowerCase());

            checkWinner();
        }

        function checkWinner() {

            for (const pattern of winningPatterns) {

                const a =
                    cells[pattern[0]].textContent;

                const b =
                    cells[pattern[1]].textContent;

                const c =
                    cells[pattern[2]].textContent;

                if (a && a === b && b === c) {

                    gameActive = false;
                    robotThinking = false;

                    if (gameMode === "robot") {

                        if (currentPlayer === playerSymbol) {
                            status.textContent =
                                "You Win! 🎉";
                        } else {
                            status.textContent =
                                "Robot Wins! 🤖";
                        }

                    } else {

                        status.textContent =
                            `Player ${currentPlayer} Wins! 🎉`;
                    }

                    return;
                }
            }

            let draw = true;

            cells.forEach(cell => {
                if (cell.textContent === "") {
                    draw = false;
                }
            });

            if (draw) {

                gameActive = false;
                robotThinking = false;

                status.textContent =
                    "It's a Draw! 🤝";

                return;
            }

            currentPlayer =
                currentPlayer === "X" ? "O" : "X";

            if (gameMode === "robot") {

                if (currentPlayer === playerSymbol) {
                    status.textContent =
                        `Your Turn (${playerSymbol})`;
                }

            } else {

                status.textContent =
                    `Player ${currentPlayer}'s Turn`;
            }
        }

        function robotMove() {

            if (!gameActive) {
                robotThinking = false;
                return;
            }

            let move;

            if (difficulty === "easy") {

                move = getRandomMove();

            } else if (difficulty === "medium") {

                if (Math.random() < 0.5) {
                    move = getBestMove();
                } else {
                    move = getRandomMove();
                }

            } else if (difficulty === "hard") {

                if (Math.random() < 0.85) {
                    move = getBestMove();
                } else {
                    move = getRandomMove();
                }

            } else if (difficulty === "unbeatable") {

                move = getBestMove();
            }

            if (move !== undefined) {

                makeMove(move, robotSymbol);
            }

            robotThinking = false;
        }

        function getRandomMove() {

            const available = [];

            cells.forEach((cell, index) => {

                if (cell.textContent === "") {
                    available.push(index);
                }
            });

            if (available.length === 0) {
                return undefined;
            }

            return available[
                Math.floor(
                    Math.random() * available.length
                )
            ];
        }

        function getBestMove() {

            const board = getBoard();

            let bestScore = -Infinity;
            let bestMove;

            for (let i = 0; i < 9; i++) {

                if (board[i] !== "") {
                    continue;
                }

                board[i] = robotSymbol;

                const score =
                    minimax(board, false);

                board[i] = "";

                if (score > bestScore) {

                    bestScore = score;
                    bestMove = i;
                }
            }

            return bestMove;
        }

        function minimax(board, maximizing) {

            const winner = getBoardWinner(board);

            if (winner === robotSymbol) {
                return 10;
            }

            if (winner === playerSymbol) {
                return -10;
            }

            if (!board.includes("")) {
                return 0;
            }

            if (maximizing) {

                let bestScore = -Infinity;

                for (let i = 0; i < 9; i++) {

                    if (board[i] !== "") {
                        continue;
                    }

                    board[i] = robotSymbol;

                    const score =
                        minimax(board, false);

                    board[i] = "";

                    bestScore =
                        Math.max(bestScore, score);
                }

                return bestScore;

            } else {

                let bestScore = Infinity;

                for (let i = 0; i < 9; i++) {

                    if (board[i] !== "") {
                        continue;
                    }

                    board[i] = playerSymbol;

                    const score =
                        minimax(board, true);

                    board[i] = "";

                    bestScore =
                        Math.min(bestScore, score);
                }

                return bestScore;
            }
        }

        function getBoard() {

            return Array.from(
                cells,
                cell => cell.textContent
            );
        }

        function getBoardWinner(board) {

            for (const pattern of winningPatterns) {

                const a = board[pattern[0]];
                const b = board[pattern[1]];
                const c = board[pattern[2]];

                if (
                    a &&
                    a === b &&
                    b === c
                ) {
                    return a;
                }
            }

            return null;
        }

        function restartGame() {

            cells.forEach(cell => {

                cell.textContent = "";

                cell.classList.remove(
                    "x",
                    "o"
                );
            });

            gameActive = true;
            robotThinking = false;

            if (gameMode === "robot") {

                currentPlayer = "X";

                if (playerSymbol === "O") {

                    currentPlayer = "X";

                    status.textContent =
                        "Robot's Turn... 🤖";

                    robotThinking = true;

                    setTimeout(() => {
                        robotMove();
                    }, 400);

                } else {

                    status.textContent =
                        "Your Turn (X)";
                }

            } else {

                currentPlayer = "X";

                status.textContent =
                    "Player X's Turn";
            }
        }

        restart.addEventListener(
            "click",
            restartGame
        );
    </script>

</body>
</html>
