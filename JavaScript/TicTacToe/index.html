<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <meta name="theme-color" content="#162447">

    <title>Tic Tac Toe Ultimate Deluxe - Dan Studios</title>

    <style>
        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            background:
                linear-gradient(
                    135deg,
                    #1f4068,
                    #162447
                );

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100dvh;

            font-family:
                "Segoe UI",
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            color: #ffffff;

            overflow: hidden;

            overscroll-behavior: none;
            touch-action: manipulation;

            -webkit-user-select: none;
            user-select: none;
        }

        button {
            font: inherit;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        /* =========================================================
           MAIN CONTAINER
        ========================================================= */

        .game-container {
            width: min(390px, 94vw);

            min-height: 420px;

            position: relative;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding: 20px 25px;

            background: rgba(255, 255, 255, 0.05);

            border:
                2px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 16px;

            box-shadow:
                0 15px 35px
                rgba(0, 0, 0, 0.5);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            isolation: isolate;
        }

        /* =========================================================
           HUD
        ========================================================= */

        .hud-panel {
            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 8px 12px;

            background:
                rgba(255, 255, 255, 0.08);

            border:
                1px solid
                rgba(255, 255, 255, 0.1);

            border-radius: 8px;

            margin-bottom: 12px;

            font-size: 13px;
            font-weight: bold;

            color: #cbd5e1;

            gap: 6px;
        }

        .hud-panel span {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;

            white-space: nowrap;
        }

        /* =========================================================
           TITLE / STATUS
        ========================================================= */

        .title {
            font-size: 22px;
            font-weight: bold;

            color: #ffbc00;

            margin-bottom: 8px;

            text-align: center;

            text-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.4);
        }

        .status {
            width: 100%;

            min-height: 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 15px;

            color: #cbd5e1;

            font-size: 15px;
            font-weight: 500;

            text-align: center;
        }

        /* =========================================================
           MAIN MENU
        ========================================================= */

        .main-menu {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-row {
            width: 100%;

            display: flex;

            gap: 10px;
        }

        /* =========================================================
           BUTTONS
        ========================================================= */

        .action-btn {
            flex: 1;

            min-height: 44px;

            background: #056676;

            color: #ffffff;

            border: none;

            padding: 10px 12px;

            font-size: 13px;
            font-weight: bold;

            border-radius: 8px;

            cursor: pointer;

            box-shadow:
                0 4px 15px
                rgba(0, 0, 0, 0.3);

            transition:
                background 0.2s,
                transform 0.1s;

            touch-action: manipulation;
        }

        .action-btn:hover {
            background: #087e8b;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        .action-btn:focus-visible {
            outline:
                3px solid
                rgba(255, 188, 0, 0.8);

            outline-offset: 2px;
        }

        .play-btn {
            width: 100%;

            min-height: 48px;

            margin-top: 10px;

            padding: 12px;

            background: #ff4b5c;

            color: #ffffff;

            border: none;

            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 15px
                rgba(255, 75, 92, 0.4);

            transition:
                transform 0.1s,
                background 0.2s;

            touch-action: manipulation;
        }

        .play-btn:hover {
            background: #ff2a40;
            transform: scale(1.02);
        }

        .play-btn:active {
            transform: scale(0.96);
        }

        /* =========================================================
           MODAL SCREENS
           
           IMPORTANT:
           visibility + opacity + pointer-events prevents
           hidden boards/grids from appearing or receiving touches.
        ========================================================= */

        .overlay-screen {
            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            padding: 20px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            border-radius: 16px;

            background: #162447;

            z-index: 100;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;

            transition:
                opacity 0.25s ease,
                visibility 0.25s ease;

            overflow: hidden;
        }

        .overlay-screen.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* =========================================================
           SETTINGS
        ========================================================= */

        .settings-screen {
            z-index: 200;
        }

        .menu-label {
            width: 100%;

            font-size: 12px;
            font-weight: bold;

            color: #cbd5e1;

            margin:
                4px 0
                4px 5px;
        }

        .menu-group {
            width: 100%;

            display: flex;

            gap: 6px;

            margin-bottom: 10px;
        }

        .menu-btn {
            flex: 1;

            min-height: 40px;

            padding: 8px 5px;

            background:
                rgba(255, 255, 255, 0.1);

            border:
                2px solid
                rgba(255, 255, 255, 0.2);

            color: #ffffff;

            font-size: 12px;
            font-weight: bold;

            border-radius: 6px;

            cursor: pointer;

            touch-action: manipulation;

            transition:
                background 0.2s,
                border-color 0.2s,
                transform 0.1s;
        }

        .menu-btn:hover {
            background:
                rgba(255, 255, 255, 0.17);
        }

        .menu-btn:active {
            transform: scale(0.96);
        }

        .menu-btn.active {
            background: #056676;

            border-color: #087e8b;

            box-shadow:
                0 0 10px
                rgba(5, 102, 118, 0.5);
        }

        /* =========================================================
           CLOSE BUTTON
        ========================================================= */

        .close-modal-btn {
            position: absolute;

            top: 12px;
            right: 12px;

            width: 42px;
            height: 42px;

            display: flex;
            justify-content: center;
            align-items: center;

            background: transparent;

            border: none;

            color: #cbd5e1;

            font-size: 28px;
            font-weight: bold;

            border-radius: 8px;

            cursor: pointer;

            touch-action: manipulation;

            transition:
                background 0.2s,
                color 0.2s;
        }

        .close-modal-btn:hover {
            background:
                rgba(255, 255, 255, 0.08);

            color: #ff4b5c;
        }

        .close-modal-btn:active {
            transform: scale(0.9);
        }

        /* =========================================================
           GAME BOARD
        ========================================================= */

        .board {
            width: min(300px, 82vw);

            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 10px;

            margin-bottom: 15px;
        }

        .cell {
            width: 100%;
            aspect-ratio: 1 / 1;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                rgba(255, 255, 255, 0.1);

            border:
                2px solid
                rgba(255, 255, 255, 0.2);

            border-radius: 12px;

            color: #ffffff;

            font-size: clamp(36px, 11vw, 48px);
            font-weight: bold;

            cursor: pointer;

            touch-action: manipulation;

            transition:
                background 0.15s,
                transform 0.1s,
                border-color 0.2s;

            -webkit-tap-highlight-color: transparent;
        }

        .cell:hover {
            background:
                rgba(255, 255, 255, 0.2);
        }

        .cell:active {
            transform: scale(0.94);
        }

        .cell:focus-visible {
            outline:
                3px solid
                rgba(255, 188, 0, 0.8);

            outline-offset: 2px;
        }

        .cell.x {
            color: #ff4b5c;

            text-shadow:
                0 0 15px
                rgba(255, 75, 92, 0.5);
        }

        .cell.o {
            color: #38bdf8;

            text-shadow:
                0 0 15px
                rgba(56, 189, 248, 0.5);
        }

        .cell.win {
            background:
                rgba(255, 188, 0, 0.25);

            border-color: #ffbc00;

            animation:
                pulseWin
                0.6s
                infinite
                alternate;
        }

        @keyframes pulseWin {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.04);
            }
        }

        /* =========================================================
           GAMEPLAY SCREEN
        ========================================================= */

        .gameplay-screen .action-btn {
            width: 100%;
            flex: none;
        }

        /* =========================================================
           ROBOT THINKING
        ========================================================= */

        .thinking {
            opacity: 0.8;
            pointer-events: none;
        }

        /* =========================================================
           SMALL PHONES
        ========================================================= */

        @media (max-width: 400px) {
            .game-container {
                width: 100vw;
                height: 100dvh;

                min-height: 100dvh;

                padding:
                    max(12px, env(safe-area-inset-top))
                    14px
                    max(12px, env(safe-area-inset-bottom))
                    14px;

                border: none;
                border-radius: 0;

                background: transparent;

                box-shadow: none;
            }

            .overlay-screen {
                border-radius: 0;

                padding:
                    max(18px, env(safe-area-inset-top))
                    15px
                    max(18px, env(safe-area-inset-bottom))
                    15px;
            }

            .hud-panel {
                font-size: 12px;
            }

            .title {
                font-size: 21px;
            }

            .board {
                width: min(300px, 86vw);
                gap: 8px;
            }

            .cell {
                border-radius: 10px;
            }
        }

        /* =========================================================
           VERY SMALL HEIGHTS
        ========================================================= */

        @media (max-height: 600px) {
            .game-container {
                padding-top: 10px;
                padding-bottom: 10px;
            }

            .hud-panel {
                margin-bottom: 6px;
            }

            .title {
                margin-bottom: 4px;
            }

            .status {
                margin-bottom: 7px;
            }

            .board {
                margin-bottom: 8px;
            }

            .overlay-screen {
                padding-top: 12px;
                padding-bottom: 12px;
            }

            .menu-group {
                margin-bottom: 5px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <!-- =========================================================
         MAIN MENU
    ========================================================== -->

    <div class="main-menu">

        <div class="hud-panel">
            <span id="statWins">🏆 Wins: 0</span>
            <span id="statLosses">❌ Losses: 0</span>
            <span id="statStreak">🔥 Streak: 0</span>
        </div>

        <div class="title">
            ❌ Tic Tac Toe ⭕
        </div>

        <div id="mainStatus" class="status">
            Main Menu
        </div>

        <div class="control-row">

            <button
                type="button"
                class="action-btn"
                id="settingsButton"
            >
                Game Settings
            </button>

            <button
                type="button"
                class="action-btn"
                id="startButton"
            >
                Start Game
            </button>

        </div>

    </div>


    <!-- =========================================================
         SETTINGS SCREEN
    ========================================================== -->

    <div
        id="settingsScreen"
        class="overlay-screen settings-screen"
        aria-hidden="true"
    >

        <button
            type="button"
            class="close-modal-btn"
            id="closeSettingsButton"
            aria-label="Close settings"
        >
            &times;
        </button>

        <div
            class="title"
            style="margin-bottom: 14px;"
        >
            Game Settings
        </div>


        <div class="menu-label">
            Game Mode
        </div>

        <div class="menu-group">

            <button
                type="button"
                class="menu-btn active"
                id="modePvp"
            >
                2 Players
            </button>

            <button
                type="button"
                class="menu-btn"
                id="modeBot"
            >
                vs Robot
            </button>

        </div>


        <div
            class="menu-label"
            id="diffLabel"
            hidden
        >
            Robot Difficulty
        </div>

        <div
            class="menu-group"
            id="diffGroup"
            hidden
        >

            <button
                type="button"
                class="menu-btn active"
                id="diffEasy"
            >
                Easy
            </button>

            <button
                type="button"
                class="menu-btn"
                id="diffMedium"
            >
                Medium
            </button>

            <button
                type="button"
                class="menu-btn"
                id="diffHard"
            >
                Hard
            </button>

            <button
                type="button"
                class="menu-btn"
                id="diffUnbeatable"
            >
                Unbeatable
            </button>

        </div>


        <div class="menu-label">
            First Turn
        </div>

        <div class="menu-group">

            <button
                type="button"
                class="menu-btn active"
                id="turnX"
            >
                Player X
            </button>

            <button
                type="button"
                class="menu-btn"
                id="turnO"
            >
                Player O
            </button>

        </div>


        <button
            type="button"
            class="play-btn"
            id="saveSettingsButton"
        >
            SAVE & CLOSE
        </button>

    </div>


            <!-- Actual Interactive Game Screen Overlay -->
        <div id="gameplayScreen" class="gameplay-screen">
            <button
                type="button"
                class="close-modal-btn"
                onclick="returnToMainMenu()"
                aria-label="Close game"
            >&times;</button>

            <div class="title gameplay-title">Match in Progress</div>

            <div id="status" class="status">
                Player X's Turn
            </div>

            <div class="board" id="board">
                <button type="button" class="cell" data-index="0" aria-label="Cell 1"></button>
                <button type="button" class="cell" data-index="1" aria-label="Cell 2"></button>
                <button type="button" class="cell" data-index="2" aria-label="Cell 3"></button>

                <button type="button" class="cell" data-index="3" aria-label="Cell 4"></button>
                <button type="button" class="cell" data-index="4" aria-label="Cell 5"></button>
                <button type="button" class="cell" data-index="5" aria-label="Cell 6"></button>

                <button type="button" class="cell" data-index="6" aria-label="Cell 7"></button>
                <button type="button" class="cell" data-index="7" aria-label="Cell 8"></button>
                <button type="button" class="cell" data-index="8" aria-label="Cell 9"></button>
            </div>

            <button
                type="button"
                class="action-btn main-menu-btn"
                onclick="returnToMainMenu()"
            >
                Main Menu
            </button>
        </div>
    </div>

    <script>
        const cells = document.querySelectorAll(".cell[data-index]");
        const gameStatus = document.getElementById("status");
        const mainStatus = document.getElementById("mainStatus");

        const settingsScreen = document.getElementById("settingsScreen");
        const gameplayScreen = document.getElementById("gameplayScreen");

        const diffLabel = document.getElementById("diffLabel");
        const diffGroup = document.getElementById("diffGroup");

        const statWins = document.getElementById("statWins");
        const statLosses = document.getElementById("statLosses");
        const statStreak = document.getElementById("statStreak");

        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let startingPlayer = "X";

        let gameActive = false;
        let robotTimeout = null;

        let gameMode = "pvp";
        let difficulty = "easy";

        let stats;

        try {
            stats = JSON.parse(localStorage.getItem("tttStats"));

            if (
                !stats ||
                typeof stats !== "object" ||
                typeof stats.wins !== "number" ||
                typeof stats.losses !== "number" ||
                typeof stats.streak !== "number"
            ) {
                throw new Error("Invalid statistics");
            }
        } catch {
            stats = {
                wins: 0,
                losses: 0,
                streak: 0
            };
        }

        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        function initUI() {
            setMode(gameMode);
            setDifficulty(difficulty);
            setFirstPlayer(startingPlayer);

            cells.forEach(cell => {
                cell.addEventListener("click", handleCellClick);
            });

            updateStatsUI();
            updateMainStatus();
            renderBoard();
        }

        function setMode(mode) {
            if (mode !== "pvp" && mode !== "bot") {
                mode = "pvp";
            }

            gameMode = mode;

            document
                .getElementById("modePvp")
                .classList.toggle("active", mode === "pvp");

            document
                .getElementById("modeBot")
                .classList.toggle("active", mode === "bot");

            const botEnabled = mode === "bot";

            diffLabel.style.display = botEnabled ? "block" : "none";
            diffGroup.style.display = botEnabled ? "flex" : "none";
        }

        function setDifficulty(diff) {
            const validDifficulties = [
                "easy",
                "medium",
                "hard",
                "unbeatable"
            ];

            if (!validDifficulties.includes(diff)) {
                diff = "easy";
            }

            difficulty = diff;

            document
                .getElementById("diffEasy")
                .classList.toggle("active", diff === "easy");

            document
                .getElementById("diffMedium")
                .classList.toggle("active", diff === "medium");

            document
                .getElementById("diffHard")
                .classList.toggle("active", diff === "hard");

            document
                .getElementById("diffUnbeatable")
                .classList.toggle("active", diff === "unbeatable");
        }

        function setFirstPlayer(player) {
            if (player !== "X" && player !== "O") {
                player = "X";
            }

            startingPlayer = player;

            document
                .getElementById("turnX")
                .classList.toggle("active", player === "X");

            document
                .getElementById("turnO")
                .classList.toggle("active", player === "O");
        }

        function saveSettings() {
            closeSettings();
            updateMainStatus();
        }

        function updateMainStatus() {
            const modeText =
                gameMode === "bot"
                    ? `vs Robot (${difficulty})`
                    : "2 Players";

            mainStatus.textContent =
                `Main Menu • ${modeText} • First: ${startingPlayer}`;
        }

        function updateStatsUI() {
            statWins.textContent = `🏆 Wins: ${stats.wins}`;
            statLosses.textContent = `❌ Losses: ${stats.losses}`;
            statStreak.textContent = `🔥 Streak: ${stats.streak}`;

            localStorage.setItem(
                "tttStats",
                JSON.stringify(stats)
            );
        }

        function openSettings() {
            if (gameplayScreen.classList.contains("active")) {
                return;
            }

            settingsScreen.classList.remove("hidden");
        }

        function closeSettings() {
            settingsScreen.classList.add("hidden");
        }

        function openGameplay() {
            closeSettings();

            gameplayScreen.classList.add("active");

            startGame();
        }

        function returnToMainMenu() {
            clearTimeout(robotTimeout);
            robotTimeout = null;

            gameActive = false;

            gameplayScreen.classList.remove("active");
            settingsScreen.classList.add("hidden");

            updateMainStatus();
        }

        function startGame() {
            clearTimeout(robotTimeout);
            robotTimeout = null;

            board = [
                "",
                "",
                "",
                "",
                "",
                "",
                "",
                "",
                ""
            ];

            currentPlayer = startingPlayer;
            gameActive = true;

            renderBoard();

            updateGameStatus();

            if (
                gameMode === "bot" &&
                currentPlayer !== startingPlayer
            ) {
                scheduleRobotMove();
            }
        }

        function renderBoard() {
            cells.forEach(cell => {
                const index = Number(cell.dataset.index);
                const value = board[index];

                cell.textContent = value;

                cell.classList.remove(
                    "x",
                    "o",
                    "win"
                );

                if (value === "X") {
                    cell.classList.add("x");
                }

                if (value === "O") {
                    cell.classList.add("o");
                }
            });
        }

        function updateGameStatus() {
            if (!gameActive) {
                return;
            }

            if (
                gameMode === "bot" &&
                currentPlayer !== startingPlayer
            ) {
                gameStatus.textContent = "Robot's Turn...";
            } else {
                gameStatus.textContent =
                    `Player ${currentPlayer}'s Turn`;
            }
        }

        function handleCellClick(event) {
            if (!gameActive) {
                return;
            }

            const index = Number(event.currentTarget.dataset.index);

            if (!Number.isInteger(index)) {
                return;
            }

            if (board[index] !== "") {
                return;
            }

            if (
                gameMode === "bot" &&
                currentPlayer !== startingPlayer
            ) {
                return;
            }

            makeMove(index, currentPlayer);

            if (
                gameActive &&
                gameMode === "bot" &&
                currentPlayer !== startingPlayer
            ) {
                scheduleRobotMove();
            }
        }

        function makeMove(index, player) {
            if (!gameActive) {
                return;
            }

            if (board[index] !== "") {
                return;
            }

            board[index] = player;

            renderBoard();

            checkResult();
        }

        function checkResult() {
            let winningCombo = null;

            for (const condition of winningConditions) {
                const [a, b, c] = condition;

                if (
                    board[a] !== "" &&
                    board[a] === board[b] &&
                    board[b] === board[c]
                ) {
                    winningCombo = condition;
                    break;
                }
            }

            if (winningCombo) {
                gameActive = false;

                clearTimeout(robotTimeout);
                robotTimeout = null;

                winningCombo.forEach(index => {
                    cells[index].classList.add("win");
                });

                if (gameMode === "bot") {
                    if (currentPlayer === startingPlayer) {
                        gameStatus.textContent = "You Win! 🎉";

                        stats.wins++;
                        stats.streak++;
                    } else {
                        gameStatus.textContent = "Robot Wins! 🤖";

                        stats.losses++;
                        stats.streak = 0;
                    }

                    updateStatsUI();
                } else {
                    gameStatus.textContent =
                        `Player ${currentPlayer} Wins! 🎉`;
                }

                return;
            }

            if (!board.includes("")) {
                gameActive = false;

                clearTimeout(robotTimeout);
                robotTimeout = null;

                gameStatus.textContent =
                    "It's a Draw! 🤝";

                if (gameMode === "bot") {
                    stats.streak = 0;
                    updateStatsUI();
                }

                return;
            }

            currentPlayer =
                currentPlayer === "X"
                    ? "O"
                    : "X";

            updateGameStatus();
        }

        function scheduleRobotMove() {
            clearTimeout(robotTimeout);

            robotTimeout = setTimeout(() => {
                robotTimeout = null;
                robotMove();
            }, 450);
        }

        function robotMove() {
            if (!gameActive) {
                return;
            }

            if (
                gameMode !== "bot" ||
                currentPlayer === startingPlayer
            ) {
                return;
            }

            const robotSymbol = getRobotSymbol();

            let moveIndex;

            if (difficulty === "easy") {
                moveIndex = getRandomMove();
            } else if (difficulty === "medium") {
                moveIndex = getSmartMove(0.5);
            } else if (difficulty === "hard") {
                moveIndex = getSmartMove(0.85);
            } else {
                moveIndex =
                    minimax(
                        board.slice(),
                        robotSymbol
                    ).index;
            }

            if (
                moveIndex === undefined ||
                board[moveIndex] !== ""
            ) {
                moveIndex = getRandomMove();
            }

            if (
                moveIndex !== undefined &&
                board[moveIndex] === ""
            ) {
                makeMove(
                    moveIndex,
                    robotSymbol
                );
            }
        }

        function getRobotSymbol() {
            return startingPlayer === "X"
                ? "O"
                : "X";
        }

        function getRandomMove() {
            const available = [];

            for (let i = 0; i < board.length; i++) {
                if (board[i] === "") {
                    available.push(i);
                }
            }

            if (available.length === 0) {
                return undefined;
            }

            const randomIndex =
                Math.floor(
                    Math.random() * available.length
                );

            return available[randomIndex];
        }

        function getSmartMove(chanceToBeSmart) {
            if (Math.random() < chanceToBeSmart) {
                const bestMove =
                    minimax(
                        board.slice(),
                        getRobotSymbol()
                    );

                if (bestMove.index !== undefined) {
                    return bestMove.index;
                }
            }

            return getRandomMove();
        }

        function minimax(newBoard, player) {
            const robotSymbol = getRobotSymbol();
            const humanSymbol =
                robotSymbol === "X"
                    ? "O"
                    : "X";

            const terminalResult =
                getTerminalScore(
                    newBoard,
                    robotSymbol,
                    humanSymbol
                );

            if (terminalResult !== null) {
                return {
                    score: terminalResult
                };
            }

            const availableSpots = [];

            for (let i = 0; i < newBoard.length; i++) {
                if (newBoard[i] === "") {
                    availableSpots.push(i);
                }
            }

            const moves = [];

            for (const index of availableSpots) {
                newBoard[index] = player;

                const nextPlayer =
                    player === "X"
                        ? "O"
                        : "X";

                const result =
                    minimax(
                        newBoard,
                        nextPlayer
                    );

                moves.push({
                    index: index,
                    score: result.score
                });

                newBoard[index] = "";
            }

            let bestMove;

            if (player === robotSymbol) {
                let bestScore = -Infinity;

                for (const move of moves) {
                    if (move.score > bestScore) {
                        bestScore = move.score;
                        bestMove = move;
                    }
                }
            } else {
                let bestScore = Infinity;

                for (const move of moves) {
                    if (move.score < bestScore) {
                        bestScore = move.score;
                        bestMove = move;
                    }
                }
            }

            return bestMove || {
                score: 0
            };
        }

        function getTerminalScore(
            currentBoard,
            robotSymbol,
            humanSymbol
        ) {
            for (const condition of winningConditions) {
                const [a, b, c] = condition;

                if (
                    currentBoard[a] !== "" &&
                    currentBoard[a] === currentBoard[b] &&
                    currentBoard[b] === currentBoard[c]
                ) {
                    return currentBoard[a] === robotSymbol
                        ? 10
                        : -10;
                }
            }

            let full = true;

            for (const value of currentBoard) {
                if (value === "") {
                    full = false;
                    break;
                }
            }

            if (full) {
                return 0;
            }

            return null;
        }

                initUI();
    </script>
