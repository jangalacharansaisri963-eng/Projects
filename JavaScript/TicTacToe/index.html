<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe Ultimate Deluxe - Dan Studios</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #1f4068, #162447);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px 25px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 390px;
        }

        /* Top HUD Stats Panel */
        .hud-panel {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hud-panel span {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .title {
            font-size: 22px;
            font-weight: bold;
            color: #ffbc00;
            margin-bottom: 8px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            text-align: center;
        }

        /* Settings Modal Overlay */
        .settings-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #162447;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            border-radius: 16px;
            padding: 20px;
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.3s ease;
        }

        .settings-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Gameplay Screen Overlay */
        .gameplay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #162447;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 16px;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .gameplay-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Close 'X' Button Style */
        .close-modal-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: transparent;
            border: none;
            color: #cbd5e1;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: color 0.2s;
        }

        .close-modal-btn:hover {
            color: #ff4b5c;
        }

        .menu-label {
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 4px;
            font-weight: bold;
            align-self: flex-start;
            margin-left: 5px;
        }

        .menu-group {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            width: 100%;
        }

        .menu-btn {
            flex: 1;
            padding: 8px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            touch-action: manipulation;
            transition: all 0.2s;
        }

        .menu-btn.active {
            background: #056676;
            border-color: #087e8b;
            box-shadow: 0 0 10px rgba(5, 102, 118, 0.5);
        }

        .play-btn {
            background: #ff4b5c;
            color: white;
            border: none;
            padding: 12px 0;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(255, 75, 92, 0.4);
            margin-top: 10px;
            transition: transform 0.1s, background 0.2s;
        }

        .play-btn:hover {
            background: #ff2a40;
            transform: scale(1.02);
        }

        .play-btn:active {
            transform: scale(0.96);
        }

        .status {
            font-size: 15px;
            margin-bottom: 15px;
            color: #cbd5e1;
            font-weight: 500;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .cell {
            width: 95px;
            height: 95px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 44px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: background 0.15s, transform 0.1s, border-color 0.2s;
        }

        .cell:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .cell:active {
            transform: scale(0.95);
        }

        .cell.x {
            color: #ff4b5c;
            text-shadow: 0 0 15px rgba(255, 75, 92, 0.5);
        }

        .cell.o {
            color: #38bdf8;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }

        .cell.win {
            background: rgba(255, 188, 0, 0.25);
            border-color: #ffbc00;
            animation: pulseWin 0.6s infinite alternate;
        }

        @keyframes pulseWin {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        .control-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .action-btn {
            flex: 1;
            background: #056676;
            color: white;
            border: none;
            padding: 11px 0;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: background 0.2s, transform 0.1s;
        }

        .action-btn:hover {
            background: #087e8b;
        }

        .action-btn:active {
            transform: scale(0.96);
        }

        @media (max-width: 400px) {
            .cell {
                width: 82px;
                height: 82px;
                font-size: 38px;
            }
            .game-container {
                width: 100vw;
                padding: 15px;
                border-radius: 0;
                border: none;
                background: transparent;
                box-shadow: none;
            }
            .settings-screen, .gameplay-screen {
                border-radius: 0;
            }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Persistent Statistics & Streak HUD -->
        <div class="hud-panel">
            <span id="statWins">🏆 Wins: 0</span>
            <span id="statLosses">❌ Losses: 0</span>
            <span id="statStreak">🔥 Streak: 0</span>
        </div>

        <div class="title">❌ Tic Tac Toe ⭕</div>
        <div id="mainStatus" class="status">Main Menu</div>

        <div class="control-row">
            <button type="button" class="action-btn" onclick="openSettings()">Game Settings</button>
            <button type="button" class="action-btn" onclick="openGameplay()">Start Game</button>
        </div>

        <!-- Game Settings Overlay Menu (Hidden by default, opens via Game Settings button) -->
        <div id="settingsScreen" class="settings-screen hidden">
            <button type="button" class="close-modal-btn" onclick="closeSettings()">&times;</button>

            <div class="title" style="margin-bottom: 14px;">Game Settings</div>
            
            <div class="menu-label">Game Mode</div>
            <div class="menu-group">
                <button type="button" class="menu-btn active" id="modePvp" onclick="setMode('pvp')">2 Players</button>
                <button type="button" class="menu-btn" id="modeBot" onclick="setMode('bot')">vs Robot</button>
            </div>

            <div class="menu-label" id="diffLabel">Robot Difficulty</div>
            <div class="menu-group" id="diffGroup">
                <button type="button" class="menu-btn active" id="diffEasy" onclick="setDifficulty('easy')">Easy</button>
                <button type="button" class="menu-btn" id="diffMedium" onclick="setDifficulty('medium')">Medium</button>
                <button type="button" class="menu-btn" id="diffHard" onclick="setDifficulty('hard')">Hard</button>
                <button type="button" class="menu-btn" id="diffUnbeatable" onclick="setDifficulty('unbeatable')">Unbeatable</button>
            </div>

            <div class="menu-label">First Turn</div>
            <div class="menu-group">
                <button type="button" class="menu-btn active" id="turnX" onclick="setFirstPlayer('X')">Player X</button>
                <button type="button" class="menu-btn" id="turnO" onclick="setFirstPlayer('O')">Player O</button>
            </div>

            <button type="button" class="play-btn" onclick="saveSettings()">SAVE & CLOSE</button>
        </div>

        <!-- Actual Interactive Game Screen Overlay (Opens via Start Game button) -->
        <div id="gameplayScreen" class="gameplay-screen">
            <button type="button" class="close-modal-btn" onclick="returnToMainMenu()">&times;</button>

            <div class="title" style="font-size: 18px; margin-bottom: 6px;">Match in Progress</div>
            <div id="status" class="status">Player X's Turn</div>

            <!-- Active Play Grid -->
            <div class="board" id="board" style="display: grid;">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <button type="button" class="action-btn" style="width: 100%; margin-top: 5px;" onclick="returnToMainMenu()">Main Menu</button>
        </div>
    </div>

    <script>
        // Elements
        const cells = document.querySelectorAll(".cell[data-index]");
        const gameStatus = document.getElementById("status"); // gameplay status
        const mainStatus = document.getElementById("mainStatus"); // main menu status
        const settingsScreen = document.getElementById("settingsScreen");
        const gameplayScreen = document.getElementById("gameplayScreen");
        const diffLabel = document.getElementById("diffLabel");
        const diffGroup = document.getElementById("diffGroup");

        const statWins = document.getElementById("statWins");
        const statLosses = document.getElementById("statLosses");
        const statStreak = document.getElementById("statStreak");

        // Game state
        let board = ["", "", "", "", "", "", "", "", ""];
        let currentPlayer = "X";
        let startingPlayer = "X";
        let gameActive = false;
        let robotTimeout = null; 
        let gameMode = "pvp"; 
        let difficulty = "easy"; 

        let stats = JSON.parse(localStorage.getItem("tttStats")) || { wins: 0, losses: 0, streak: 0 };
        updateStatsUI();

        const winningConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], 
            [0, 3, 6], [1, 4, 7], [2, 5, 8], 
            [0, 4, 8], [2, 4, 6]            
        ];

        // Initialize UI according to defaults
        function initUI() {
            setMode(gameMode);
            setDifficulty(difficulty);
            setFirstPlayer(startingPlayer);

            // Attach listeners to cells
            cells.forEach(cell => cell.addEventListener("click", handleCellClick));

            // Hide difficulty controls when pvp
            if (gameMode === "pvp") {
                diffLabel.style.display = "none";
                diffGroup.style.display = "none";
            }

            updateMainStatus();
        }

        function setMode(mode) {
            gameMode = mode;
            document.getElementById("modePvp").classList.toggle("active", mode === "pvp");
            document.getElementById("modeBot").classList.toggle("active", mode === "bot");
            if (mode === "bot") {
                diffLabel.style.display = "block";
                diffGroup.style.display = "flex";
            } else {
                diffLabel.style.display = "none";
                diffGroup.style.display = "none";
            }
        }

        function setDifficulty(diff) {
            difficulty = diff;
            document.getElementById("diffEasy").classList.toggle("active", diff === "easy");
            document.getElementById("diffMedium").classList.toggle("active", diff === "medium");
            document.getElementById("diffHard").classList.toggle("active", diff === "hard");
            document.getElementById("diffUnbeatable").classList.toggle("active", diff === "unbeatable");
        }

        function setFirstPlayer(player) {
            startingPlayer = player;
            document.getElementById("turnX").classList.toggle("active", player === "X");
            document.getElementById("turnO").classList.toggle("active", player === "O");
        }

        function saveSettings() {
            // Persist nothing special beyond variables (they already hold the values).
            // Close settings and update main menu
            closeSettings();
            updateMainStatus();
        }

        function updateMainStatus() {
            let modeText = gameMode === "bot" ? `vs Robot (${difficulty})` : `2 Players`;
            mainStatus.innerText = `Main Menu • ${modeText} • First: ${startingPlayer}`;
        }

        function updateStatsUI() {
            statWins.innerText = `🏆 Wins: ${stats.wins}`;
            statLosses.innerText = `❌ Losses: ${stats.losses}`;
            statStreak.innerText = `🔥 Streak: ${stats.streak}`;
            localStorage.setItem("tttStats", JSON.stringify(stats));
        }

        function openSettings() {
            settingsScreen.classList.remove("hidden");
        }

        function closeSettings() {
            settingsScreen.classList.add("hidden");
        }

        function openGameplay() {
            gameplayScreen.classList.add("active");
            startGame();
        }

        function returnToMainMenu() {
            clearTimeout(robotTimeout);
            gameplayScreen.classList.remove("active");
            settingsScreen.classList.add("hidden");
            gameActive = false;
            updateMainStatus();
        }

        function startGame() {
            clearTimeout(robotTimeout); 
            board = ["", "", "", "", "", "", "", "", ""];
            currentPlayer = startingPlayer;
            gameActive = true;
            renderBoard();
            gameStatus.innerText = (gameMode === "bot" && currentPlayer !== startingPlayer) ? "Robot's Turn..." : `Player ${currentPlayer}'s Turn`;

            // If robot starts and mode is bot, schedule robot move
            if (gameMode === "bot" && currentPlayer !== startingPlayer) {
                robotTimeout = setTimeout(robotMove, 450);
            }
        }

        function renderBoard() {
            cells.forEach(cell => {
                const idx = parseInt(cell.getAttribute("data-index"), 10);
                cell.innerText = board[idx];
                cell.classList.remove("x", "o", "win");
                if (board[idx] === "X") cell.classList.add("x");
                if (board[idx] === "O") cell.classList.add("o");
            });
        }

        function handleCellClick(e) {
            const index = parseInt(e.currentTarget.getAttribute("data-index"), 10);

            if (board[index] !== "" || !gameActive) return;

            // If playing vs robot, prevent clicking when it's robot's turn
            if (gameMode === "bot" && currentPlayer !== startingPlayer) return;

            makeMove(index, currentPlayer);

            // If after player's move game continues and robot's turn, schedule robot
            if (gameActive && gameMode === "bot" && currentPlayer !== startingPlayer) {
                clearTimeout(robotTimeout);
                robotTimeout = setTimeout(robotMove, 450);
            }
        }

        function makeMove(index, player) {
            board[index] = player;
            const cell = document.querySelector(`.cell[data-index="${index}"]`);
            cell.innerText = player;
            cell.classList.add(player.toLowerCase());

            checkResult();
        }

        function checkResult() {
            let roundWon = false;
            let winningCombo = [];

            for (let condition of winningConditions) {
                let a = board[condition[0]];
                let b = board[condition[1]];
                let c = board[condition[2]];

                if (a === "" || b === "" || c === "") continue;

                if (a === b && b === c) {
                    roundWon = true;
                    winningCombo = condition;
                    break;
                }
            }

            if (roundWon) {
                gameActive = false;
                clearTimeout(robotTimeout);
                winningCombo.forEach(idx => {
                    document.querySelector(`.cell[data-index="${idx}"]`).classList.add("win");
                });

                // Determine messaging and stats only when vs Robot
                if (gameMode === "bot") {
                    // If winner equals startingPlayer, user won, else robot won
                    if (currentPlayer === startingPlayer) {
                        gameStatus.innerText = "You Win! 🎉";
                        stats.wins++;
                        stats.streak++;
                    } else {
                        gameStatus.innerText = "Robot Wins! 🤖";
                        stats.losses++;
                        stats.streak = 0;
                    }
                } else {
                    gameStatus.innerText = `Player ${currentPlayer} Wins! 🎉`;
                }

                updateStatsUI();
                return;
            }

            if (!board.includes("")) {
                gameStatus.innerText = "It's a Draw! 🤝";
                gameActive = false;
                clearTimeout(robotTimeout);
                stats.streak = 0;
                updateStatsUI();
                return;
            }

            // toggle player
            currentPlayer = currentPlayer === "X" ? "O" : "X";
            gameStatus.innerText = (gameMode === "bot" && currentPlayer !== startingPlayer) ? "Robot's Turn..." : `Player ${currentPlayer}'s Turn`;
        }

        function robotMove() {
            if (!gameActive) return;

            let moveIndex;

            if (difficulty === "easy") {
                moveIndex = getRandomMove();
            } 
            else if (difficulty === "medium") {
                moveIndex = getSmartMove(0.5);
            } 
            else if (difficulty === "hard") {
                moveIndex = getSmartMove(0.85);
            } 
            else if (difficulty === "unbeatable") {
                moveIndex = minimax(board.slice(), getRobotSymbol()).index;
            }

            if (moveIndex === undefined || board[moveIndex] !== "") {
                // fallback
                moveIndex = getRandomMove();
            }

            if (moveIndex !== undefined && board[moveIndex] === "") {
                makeMove(moveIndex, getRobotSymbol());
            }
        }

        function getRobotSymbol() {
            // robot plays the opposite of startingPlayer
            return startingPlayer === "X" ? "O" : "X";
        }

        function getRandomMove() {
            const avail = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
            if (avail.length === 0) return undefined;
            return avail[Math.floor(Math.random() * avail.length)];
        }

        function getSmartMove(chanceToBeSmart) {
            // chanceToBeSmart: probability to pick a strategic move (minimax) vs random
            if (Math.random() < chanceToBeSmart) {
                // Use minimax for best move for robot
                const best = minimax(board.slice(), getRobotSymbol());
                return best.index;
            }
            // otherwise random
            return getRandomMove();
        }

        // Minimax implementation: returns { index, score }
        function minimax(newBoard, player) {
            // Available spots
            const availSpots = newBoard.map((v, i) => v === "" ? i : null).filter(v => v !== null);

            // Check terminal states
            for (let condition of winningConditions) {
                const [a, b, c] = condition;
                if (newBoard[a] && newBoard[a] === newBoard[b] && newBoard[b] === newBoard[c]) {
                    if (newBoard[a] === getRobotSymbol()) return { score: 10 };
                    else return { score: -10 };
                }
            }

            if (availSpots.length === 0) return { score: 0 };

            const moves = [];

            for (let i = 0; i < availSpots.length; i++) {
                const index = availSpots[i];
                const move = {};
                move.index = index;
                newBoard[index] = player;

                if (player === getRobotSymbol()) {
                    const result = minimax(newBoard, player === "X" ? "O" : "X");
                    move.score = result.score;
                } else {
                    const result = minimax(newBoard, player === "X" ? "O" : "X");
                    move.score = result.score;
                }

                // reset spot
                newBoard[index] = "";

                moves.push(move);
            }

            // Choose best move
            let bestMove;
            if (player === getRobotSymbol()) {
                let bestScore = -Infinity;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score > bestScore) {
                        bestScore = moves[i].score;
                        bestMove = moves[i];
                    }
                }
            } else {
                let bestScore = Infinity;
                for (let i = 0; i < moves.length; i++) {
                    if (moves[i].score < bestScore) {
                        bestScore = moves[i].score;
                        bestMove = moves[i];
                    }
                }
            }

            return bestMove;
        }

        // Initialize UI on load
        initUI();
    </script>
</body>
</html>
