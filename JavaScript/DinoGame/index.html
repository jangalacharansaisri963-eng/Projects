<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Dino Game</title>

    <!-- Game Styling -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==========================================
         GAME CONTAINER
         ========================================== -->

    <main id="game-container">

        <!-- Score -->
        <div id="score">
            HI 00000
        </div>

        <!-- Game Canvas -->
        <canvas
            id="game"
            width="900"
            height="300"
        ></canvas>

        <!-- Game Over Message -->
        <div id="game-over" class="hidden">

            <h1>GAME OVER</h1>

            <p>
                Press SPACE to restart
            </p>

        </div>

    </main>


    <!-- ==========================================
         GAME JAVASCRIPT
         ========================================== -->

    <script src="game.js"></script>

</body>

</html>
