<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Dino Game</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main id="game-container">

        <div id="score">
            HI 00000 00000
        </div>


        <canvas
            id="game"
            width="900"
            height="300"
        ></canvas>


        <!-- GAME OVER SCREEN -->

        <div
            id="game-over"
            class="hidden"
        >

            <h1>
                GAME OVER
            </h1>


            <button
                id="restart-button"
                type="button"
            >
                ↻
            </button>

        </div>

    </main>


    <!-- ======================================
         GAME JAVASCRIPT
         ====================================== -->

    <script src="config.js"></script>

    <script src="dino.js"></script>

    <script src="obstacles.js"></script>

    <script src="game.js"></script>

    <script src="controls.js"></script>


    <!-- ======================================
         DEVELOPER CONSOLE
         ====================================== -->

    <script src="console.js"></script>


</body>

</html>
