<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Vector Strike</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff007b;
            --bg-dark: #050508;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: var(--bg-dark);
            touch-action: none;
        }

        canvas {
            display: block;
        }

        /* UI Overlays */
        .ui-layer {
            position: absolute;
            pointer-events: none;
            z-index: 5;
        }

        .overlay {
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 0.5s;
            pointer-events: all;
            z-index: 10;
        }

        .hidden {
            opacity: 0;
            pointer-events: none !important;
        }

        .content h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            letter-spacing: 10px;
            color: var(--neon-blue);
            text-shadow: 0 0 20px var(--neon-blue);
            margin-bottom: 0.5rem;
        }

        button {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 1rem 2.5rem;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 2rem;
            box-shadow: 0 0 10px rgba(255, 0, 123, 0.3);
            pointer-events: all;
        }

        button:hover {
            background: var(--neon-pink);
            color: white;
            box-shadow: 0 0 30px var(--neon-pink);
        }

        /* HUD */
        #hud {
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: calc(100% - 40px);
        }

        .score-container {
            font-size: 1.5rem;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .health-bar-bg {
            width: 150px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--neon-blue);
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            transition: width 0.3s;
        }

        /* Mobile Controls */
        #touch-controls {
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            display: none;
        }

        @media (pointer: coarse) {
            #touch-controls { display: block; }
            .content p { font-size: 0.9rem; }
        }

        #joystick-base {
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(0, 242, 255, 0.3);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joystick-knob {
            width: 50px;
            height: 50px;
            background: var(--neon-blue);
            border-radius: 50%;
            box-shadow: 0 0 15px var(--neon-blue);
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="hud" class="ui-layer">
            <div class="score-container">SCORE: <span id="score">0</span></div>
            <div class="health-bar-bg"><div id="health-bar"></div></div>
        </div>

        <div id="touch-controls" class="ui-layer">
            <div id="joystick-base">
                <div id="joystick-knob"></div>
            </div>
        </div>

        <div id="menu-overlay" class="ui-layer overlay">
            <div class="content">
                <h1>NEON STRIKE</h1>
                <p>WASD to Move | Mouse to Aim & Shoot<br>Mobile: Left Side Joystick | Right Side Aim/Fire</p>
                <button id="start-btn">INITIALIZE</button>
            </div>
        </div>

        <div id="game-over-overlay" class="ui-layer overlay hidden">
            <div class="content">
                <h1 style="color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink);">SYSTEM FAILURE</h1>
                <p>Final Score: <span id="final-score">0</span></p>
                <button id="restart-btn">REBOOT</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            PLAYER_SPEED: 300,
            BULLET_SPEED: 700,
            ENEMY_SPAWN_RATE: 1200,
            PLAYER_MAX_HEALTH: 100,
            COLORS: {
                player: '#00f2ff',
                enemy: '#ff007b',
                bullet: '#ffffff',
                particle: '#00f2ff'
            }
        };

        class InputHandler {
            constructor() {
                this.keys = new Set();
                this.mouse = { x: 0, y: 0, pressed: false };
                this.isTouch = false;
                this.moveJoystick = { active: false, x: 0, y: 0, startX: 0, startY: 0 };

                this.initMouseEvents();
                this.initTouchEvents();
            }

            initMouseEvents() {
                window.addEventListener('keydown', (e) => this.keys.add(e.code));
                window.addEventListener('keyup', (e) => this.keys.delete(e.code));
                window.addEventListener('mousemove', (e) => {
                    this.mouse.x = e.clientX;
                    this.mouse.y = e.clientY;
                });
                window.addEventListener('mousedown', () => this.mouse.pressed = true);
                window.addEventListener('mouseup', () => this.mouse.pressed = false);
            }

            initTouchEvents() {
                const knob = document.getElementById('joystick-knob');

                window.addEventListener('touchstart', (e) => {
                    this.isTouch = true;
                    for (let touch of e.changedTouches) {
                        if (touch.clientX < window.innerWidth / 2) {
                            this.moveJoystick.active = true;
                            this.moveJoystick.startX = touch.clientX;
                            this.moveJoystick.startY = touch.clientY;
                        } else {
                            this.mouse.pressed = true;
                            this.mouse.x = touch.clientX;
                            this.mouse.y = touch.clientY;
                        }
                    }
                }, { passive: false });

                window.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    for (let touch of e.touches) {
                        if (touch.clientX < window.innerWidth / 2 && this.moveJoystick.active) {
                            const dx = touch.clientX - this.moveJoystick.startX;
                            const dy = touch.clientY - this.moveJoystick.startY;
                            const dist = Math.min(Math.hypot(dx, dy), 50);
                            const angle = Math.atan2(dy, dx);
                            this.moveJoystick.x = (Math.cos(angle) * dist) / 50;
                            this.moveJoystick.y = (Math.sin(angle) * dist) / 50;
                            knob.style.transform = `translate(${this.moveJoystick.x * 35}px, ${this.moveJoystick.y * 35}px)`;
                        } else {
                            this.mouse.x = touch.clientX;
                            this.mouse.y = touch.clientY;
                        }
                    }
                }, { passive: false });

                window.addEventListener('touchend', (e) => {
                    for (let touch of e.changedTouches) {
                        if (touch.clientX < window.innerWidth / 2) {
                            this.moveJoystick.active = false;
                            this.moveJoystick.x = 0;
                            this.moveJoystick.y = 0;
                            knob.style.transform = `translate(0, 0)`;
                        } else {
                            this.mouse.pressed = false;
                        }
                    }
                });
            }

            isPressed(code) { return this.keys.has(code); }
        }

        class Entity {
            constructor(x, y, radius, color) {
                this.x = x;
                this.y = y;
                this.radius = radius;
                this.color = color;
                this.markedForDeletion = false;
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                this.renderShape(ctx);
                ctx.stroke();
                ctx.restore();
            }
        }

        class Player extends Entity {
            constructor(x, y) {
                super(x, y, 15, CONFIG.COLORS.player);
                this.angle = 0;
                this.cooldown = 0;
            }

            renderShape(ctx) {
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.moveTo(20, 0);
                ctx.lineTo(-15, -15);
                ctx.lineTo(-15, 15);
                ctx.closePath();
            }

            update(dt, input, width, height) {
                let mx = 0, my = 0;
                if (input.isPressed('KeyW') || input.isPressed('ArrowUp')) my -= 1;
                if (input.isPressed('KeyS') || input.isPressed('ArrowDown')) my += 1;
                if (input.isPressed('KeyA') || input.isPressed('ArrowLeft')) mx -= 1;
                if (input.isPressed('KeyD') || input.isPressed('ArrowRight')) mx += 1;

                if (input.moveJoystick.active) {
                    mx = input.moveJoystick.x;
                    my = input.moveJoystick.y;
                }

                const mag = Math.hypot(mx, my);
                if (mag > 0) {
                    this.x += (mx / (mag > 1 ? mag : 1)) * CONFIG.PLAYER_SPEED * dt;
                    this.y += (my / (mag > 1 ? mag : 1)) * CONFIG.PLAYER_SPEED * dt;
                }

                this.x = Math.max(this.radius, Math.min(width - this.radius, this.x));
                this.y = Math.max(this.radius, Math.min(height - this.radius, this.y));
                this.angle = Math.atan2(input.mouse.y - this.y, input.mouse.x - this.x);
                if (this.cooldown > 0) this.cooldown -= dt;
            }
        }

        class Bullet extends Entity {
            constructor(x, y, angle) {
                super(x, y, 3, CONFIG.COLORS.bullet);
                this.vx = Math.cos(angle) * CONFIG.BULLET_SPEED;
                this.vy = Math.sin(angle) * CONFIG.BULLET_SPEED;
            }
            renderShape(ctx) { ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                if (this.x < -100 || this.x > window.innerWidth + 100 || this.y < -100 || this.y > window.innerHeight + 100) this.markedForDeletion = true;
            }
        }

        class Enemy extends Entity {
            constructor(x, y) {
                super(x, y, 18, CONFIG.COLORS.enemy);
                this.speed = 80 + Math.random() * 100;
            }
            renderShape(ctx) {
                const s = this.radius;
                ctx.rect(this.x - s, this.y - s, s * 2, s * 2);
            }
            update(dt, px, py) {
                const angle = Math.atan2(py - this.y, px - this.x);
                this.x += Math.cos(angle) * this.speed * dt;
                this.y += Math.sin(angle) * this.speed * dt;
            }
        }

        class Particle extends Entity {
            constructor(x, y, color) {
                super(x, y, Math.random() * 2, color);
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 150;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                this.alpha -= dt * 1.2;
                if (this.alpha <= 0) this.markedForDeletion = true;
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.input = new InputHandler();
                this.score = 0;
                this.health = CONFIG.PLAYER_MAX_HEALTH;
                this.lastTime = 0;
                this.spawnTimer = 0;
                this.state = 'MENU';
                this.player = null;
                this.bullets = [];
                this.enemies = [];
                this.particles = [];

                this.initResize();
                this.bindEvents();
                requestAnimationFrame((t) => this.loop(t));
            }

            initResize() {
                const res = () => {
                    this.canvas.width = window.innerWidth;
                    this.canvas.height = window.innerHeight;
                };
                window.onresize = res;
                res();
            }

            bindEvents() {
                document.getElementById('start-btn').onclick = () => this.start();
                document.getElementById('restart-btn').onclick = () => this.start();
            }

            start() {
                this.score = 0;
                this.health = CONFIG.PLAYER_MAX_HEALTH;
                this.player = new Player(this.canvas.width / 2, this.canvas.height / 2);
                this.enemies = [];
                this.bullets = [];
                this.particles = [];
                this.state = 'PLAYING';
                document.querySelectorAll('.overlay').forEach(el => el.classList.add('hidden'));
                this.updateHUD();
            }

            spawnEnemy() {
                let x, y;
                if (Math.random() < 0.5) {
                    x = Math.random() < 0.5 ? -50 : this.canvas.width + 50;
                    y = Math.random() * this.canvas.height;
                } else {
                    x = Math.random() * this.canvas.width;
                    y = Math.random() < 0.5 ? -50 : this.canvas.height + 50;
                }
                this.enemies.push(new Enemy(x, y));
            }

            updateHUD() {
                document.getElementById('score').innerText = this.score;
                document.getElementById('health-bar').style.width = `${this.health}%`;
            }

            gameOver() {
                this.state = 'GAMEOVER';
                document.getElementById('final-score').innerText = this.score;
                document.getElementById('game-over-overlay').classList.remove('hidden');
            }

            loop(timeStamp) {
                const dt = Math.min((timeStamp - this.lastTime) / 1000, 0.1);
                this.lastTime = timeStamp;
                if (this.state === 'PLAYING') this.update(dt);
                this.draw();
                requestAnimationFrame((t) => this.loop(t));
            }

            update(dt) {
                this.player.update(dt, this.input, this.canvas.width, this.canvas.height);
                if (this.input.mouse.pressed && this.player.cooldown <= 0) {
                    this.bullets.push(new Bullet(this.player.x, this.player.y, this.player.angle));
                    this.player.cooldown = 0.15;
                }
                this.spawnTimer += dt * 1000;
                if (this.spawnTimer > CONFIG.ENEMY_SPAWN_RATE) {
                    this.spawnEnemy();
                    this.spawnTimer = 0;
                }

                [...this.bullets, ...this.enemies, ...this.particles].forEach(e => e.update(dt, this.player.x, this.player.y));

                this.bullets.forEach(b => {
                    this.enemies.forEach(e => {
                        if (Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) {
                            b.markedForDeletion = e.markedForDeletion = true;
                            this.score += 100;
                            for(let i=0; i<10; i++) this.particles.push(new Particle(e.x, e.y, CONFIG.COLORS.enemy));
                        }
                    });
                });

                this.enemies.forEach(e => {
                    if (Math.hypot(this.player.x - e.x, this.player.y - e.y) < this.player.radius + e.radius) {
                        e.markedForDeletion = true;
                        this.health -= 20;
                        for(let i=0; i<15; i++) this.particles.push(new Particle(this.player.x, this.player.y, CONFIG.COLORS.player));
                        if (this.health <= 0) this.gameOver();
                        this.updateHUD();
                    }
                });

                this.bullets = this.bullets.filter(b => !b.markedForDeletion);
                this.enemies = this.enemies.filter(e => !e.markedForDeletion);
                this.particles = this.particles.filter(p => !p.markedForDeletion);
            }

            draw() {
                this.ctx.fillStyle = 'rgba(5, 5, 8, 0.3)';
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                if (this.state === 'PLAYING') {
                    this.particles.forEach(p => p.draw(this.ctx));
                    this.bullets.forEach(b => b.draw(this.ctx));
                    this.enemies.forEach(e => e.draw(this.ctx));
                    this.player.draw(this.ctx);
                }
            }
        }

        window.onload = () => new Game();
    </script>
</body>
</html>
