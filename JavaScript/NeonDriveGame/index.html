<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Highway Dash: Survival</title>
    <style>
        :root {
            --sky: #8ecae6;
            --grass: #7fb069;
            --road: #333;
            --health-color: #39ff14;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: none; user-select: none; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--sky);
            font-family: 'Segoe UI', sans-serif;
        }

        #ui-layer {
            position: absolute; inset: 0; pointer-events: none; z-index: 10;
        }

        /* HUD - High position to avoid phone bars */
        #hud {
            position: absolute; top: 50px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
        }

        .stat {
            background: rgba(255,255,255,0.9); padding: 10px; border-radius: 10px;
            text-align: center; min-width: 80px; box-shadow: 0 4px 0 #ccc;
        }

        #health-container {
            position: absolute; top: 120px; left: 20px; width: 150px; height: 12px;
            background: rgba(0,0,0,0.3); border-radius: 6px; overflow: hidden; border: 2px solid white;
        }
        #health-bar { width: 100%; height: 100%; background: var(--health-color); transition: width 0.3s; }

        .overlay {
            position: absolute; inset: 0; background: rgba(255,255,255,0.9);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; z-index: 100; text-align: center;
        }

        .btn {
            padding: 20px 50px; font-size: 20px; font-weight: bold;
            background: #222; color: white; border: none; border-radius: 15px;
            cursor: pointer; box-shadow: 0 5px 0 #000; margin-top: 20px;
        }

        /* Control Instructions */
        #tip { position: absolute; bottom: 180px; width: 100%; text-align: center; color: white; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="hud">
        <div class="stat"><small>SPEED</small><br><b id="ui-spd">0</b></div>
        <div class="stat"><small>COINS</small><br><b id="ui-coin">0</b></div>
        <div class="stat"><small>DIST</small><br><b id="ui-dist">0</b></div>
    </div>

    <div id="health-container"><div id="health-bar"></div></div>

    <div id="tip">DRAG ANYWHERE TO STEER • HOLD FOR GAS</div>

    <div id="start-screen" class="overlay">
        <h1 style="font-size: 40px; color: #e63946;">HIGHWAY DASH</h1>
        <p>Don't hit other cars!<br>The center barrier slows you down.</p>
        <button class="btn" onclick="Engine.start()">START DRIVING</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1>WRECKED</h1>
        <p id="final-results"></p>
        <button class="btn" onclick="Engine.start()">PLAY AGAIN</button>
    </div>
</div>

<canvas id="gameCanvas"></canvas>

<script>
/**
 * HIGHWAY DASH: SURVIVAL
 * Clean, playable arcade driving
 */

const CONFIG = {
    ROAD_W: 420,
    BARRIER_W: 16,
    MAX_SPD: 12,
    ACCEL: 0.1,
    FRICTION: 0.05,
    LANE_COUNT: 4
};

const Input = {
    touchX: 0, 
    isDown: false,
    init() {
        window.addEventListener('pointerdown', (e) => { this.isDown = true; this.updateX(e); });
        window.addEventListener('pointermove', (e) => { this.updateX(e); });
        window.addEventListener('pointerup', () => { this.isDown = false; });
    },
    updateX(e) {
        this.touchX = (e.clientX / window.innerWidth - 0.5) * 2;
    }
};

class EngineCore {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.reset();
        this.init();
    }

    init() {
        window.onresize = () => {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        };
        window.onresize();
        Input.init();
    }

    reset() {
        this.player = { x: 100, y: 0, spd: 0, health: 100, w: 45, h: 85, hitTimer: 0 };
        this.npcs = [];
        this.coins = [];
        this.nature = [];
        this.dist = 0;
        this.score = 0;
        this.isRunning = false;
        this.laneCooldowns = [0, 0, 0, 0];
    }

    start() {
        this.reset();
        this.player.y = this.canvas.height - 200;
        this.isRunning = true;
        document.querySelectorAll('.overlay').forEach(s => s.classList.add('hidden'));
        if(!this.loopActive) { this.loop(); this.loopActive = true; }
    }

    spawn() {
        // Traffic Spawner with Gap Logic
        if (Math.random() < 0.04) {
            let possibleLanes = [];
            for(let i=0; i<4; i++) {
                if(this.laneCooldowns[i] <= 0) possibleLanes.push(i);
            }

            if(possibleLanes.length > 0) {
                const lane = possibleLanes[Math.floor(Math.random() * possibleLanes.length)];
                const oncoming = lane < 2;
                this.npcs.push({
                    lane, 
                    y: -200, 
                    spd: oncoming ? 4 : 2, 
                    oncoming, 
                    w: 48, h: 90, 
                    col: oncoming ? '#444' : '#f4a261'
                });
                this.laneCooldowns[lane] = 80; // Prevent cars spawning right on top of each other
            }
        }

        for(let i=0; i<4; i++) this.laneCooldowns[i]--;

        if (Math.random() < 0.01) this.coins.push({ x: (Math.random()-0.5)*380, y: -50 });
        if (Math.random() < 0.1) this.nature.push({ x: (Math.random()>0.5?1:-1)*(260+Math.random()*200), y: -100, s: 20+Math.random()*30 });
    }

    update() {
        if (!this.isRunning) return;

        const p = this.player;

        // Drive Logic
        if (Input.isDown) p.spd += CONFIG.ACCEL;
        else p.spd -= CONFIG.FRICTION;
        p.spd = Math.max(0, Math.min(p.spd, CONFIG.MAX_SPD));

        // Steering Logic (Follow Finger)
        const targetX = Input.touchX * (CONFIG.ROAD_W/2 - 25);
        p.x += (targetX - p.x) * 0.15;

        // Barrier Physics (Non-fatal)
        const inGap = (this.dist % 3000 < 200);
        if (!inGap && Math.abs(p.x) < CONFIG.BARRIER_W) {
            p.spd *= 0.8; // Slow down
            p.x += p.x > 0 ? 5 : -5; // Bounce off
            p.hitTimer = 10;
        }

        this.dist += p.spd;
        this.spawn();

        // NPCs Update
        this.npcs.forEach((n, i) => {
            const relSpd = n.oncoming ? (n.spd + p.spd) : (p.spd - n.spd);
            n.y += relSpd;

            if (this.hitTest(p, n)) {
                this.takeDamage(25);
                this.npcs.splice(i, 1);
            }
            if (n.y > this.canvas.height + 200 || n.y < -500) this.npcs.splice(i, 1);
        });

        // Coins Update
        this.coins.forEach((c, i) => {
            c.y += p.spd;
            if (Math.hypot(p.x - c.x, p.y - c.y) < 40) { this.score++; this.coins.splice(i, 1); }
            if (c.y > this.canvas.height) this.coins.splice(i, 1);
        });

        this.nature.forEach((n, i) => {
            n.y += p.spd;
            if (n.y > this.canvas.height + 100) this.nature.splice(i, 1);
        });

        if(p.hitTimer > 0) p.hitTimer--;

        // UI
        document.getElementById('ui-spd').innerText = Math.floor(p.spd * 15);
        document.getElementById('ui-coin').innerText = this.score;
        document.getElementById('ui-dist').innerText = Math.floor(this.dist/10);
        document.getElementById('health-bar').style.width = p.health + '%';
        if(p.health < 30) document.getElementById('health-bar').style.background = 'red';
        else document.getElementById('health-bar').style.background = 'var(--health-color)';
    }

    takeDamage(amt) {
        this.player.health -= amt;
        this.player.hitTimer = 20;
        if (this.player.health <= 0) this.gameOver();
    }

    hitTest(p, n) {
        const px = p.x + this.canvas.width/2 - p.w/2;
        const nx = (n.lane - 1.5) * (CONFIG.ROAD_W/4) + this.canvas.width/2 - n.w/2;
        return px < nx + n.w && px + p.w > nx && p.y < n.y + n.h && p.y + p.h > n.y;
    }

    draw() {
        const ctx = this.ctx; const cw = this.canvas.width; const ch = this.canvas.height;
        
        // Environment
        ctx.fillStyle = '#7fb069'; ctx.fillRect(0,0,cw,ch);
        ctx.fillStyle = '#333'; ctx.fillRect(cw/2 - CONFIG.ROAD_W/2, 0, CONFIG.ROAD_W, ch);
        
        // Lines
        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.setLineDash([20, 30]);
        ctx.lineDashOffset = -this.dist;
        ctx.beginPath();
        ctx.moveTo(cw/2 - 100, 0); ctx.lineTo(cw/2 - 100, ch);
        ctx.moveTo(cw/2 + 100, 0); ctx.lineTo(cw/2 + 100, ch);
        ctx.stroke();

        // Barrier
        const inGap = (this.dist % 3000 < 200);
        if (!inGap) {
            ctx.fillStyle = '#888'; ctx.fillRect(cw/2 - 8, 0, 16, ch);
            ctx.fillStyle = '#666'; ctx.fillRect(cw/2 - 2, 0, 4, ch);
        }

        this.nature.forEach(n => {
            ctx.fillStyle = '#2d6a4f';
            ctx.beginPath(); ctx.arc(n.x + cw/2, n.y, n.s, 0, 7); ctx.fill();
        });

        this.coins.forEach(c => {
            ctx.fillStyle = '#ffb703'; ctx.beginPath(); ctx.arc(c.x + cw/2, c.y, 10, 0, 7); ctx.fill();
        });

        this.npcs.forEach(n => {
            const nx = (n.lane - 1.5) * (CONFIG.ROAD_W/4) + cw/2 - n.w/2;
            this.drawCar(nx, n.y, n.w, n.h, n.col, n.oncoming);
        });

        const px = this.player.x + cw/2 - this.player.w/2;
        if (this.player.hitTimer % 2 === 0) {
            this.drawCar(px, this.player.y, this.player.w, this.player.h, '#e63946', false);
        }
    }

    drawCar(x, y, w, h, col, oncoming) {
        const ctx = this.ctx;
        ctx.fillStyle = col; ctx.fillRect(x, y, w, h);
        ctx.fillStyle = oncoming ? '#222' : '#eee';
        const windY = oncoming ? y + h - 25 : y + 10;
        ctx.fillRect(x + 5, windY, w - 10, 15);
        // Headlights
        if(oncoming) {
            ctx.fillStyle = 'rgba(255,255,100,0.5)';
            ctx.beginPath(); ctx.arc(x+10, y, 15, 0, 7); ctx.fill();
            ctx.beginPath(); ctx.arc(x+w-10, y, 15, 0, 7); ctx.fill();
        }
    }

    gameOver() {
        this.isRunning = false;
        document.getElementById('final-results').innerText = `Dist: ${Math.floor(this.dist/10)}m | Coins: ${this.score}`;
        document.getElementById('game-over').classList.remove('hidden');
    }

    loop() {
        this.update(); this.draw();
        requestAnimationFrame(() => this.loop());
    }
}

const Engine = new EngineCore();
</script>
</body>
</html>
