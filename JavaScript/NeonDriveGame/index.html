<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Highway Dash: Daylight</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --grass-green: #4db34d;
            --road-grey: #3d3d3d;
            --player-red: #e63946;
            --ui-glass: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--sky-blue);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas { display: block; }

        /* HUD Positioning */
        #hud {
            position: absolute;
            top: 40px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 18px;
            border-radius: 12px;
            border-bottom: 3px solid #ccc;
            min-width: 90px;
            text-align: center;
        }

        .stat-label { font-size: 10px; color: #666; font-weight: bold; text-transform: uppercase; }
        .stat-value { font-size: 22px; font-weight: 900; color: #222; display: block; }

        /* Overlays */
        .overlay {
            position: absolute; inset: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; text-align: center;
            padding: 30px;
        }

        h1 { font-size: 48px; margin: 0; color: var(--player-red); text-transform: uppercase; letter-spacing: -2px; }
        p { color: #444; margin: 15px 0 30px 0; font-weight: 500; }

        .btn {
            padding: 20px 50px; font-size: 20px; font-weight: bold;
            background: #222; color: white;
            border: none; border-radius: 15px; cursor: pointer;
            box-shadow: 0 10px 0 #000;
            transition: all 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 6px 0 #000; }

        .hidden { display: none !important; }

        /* CONTROLS - Positioned Higher for System Gestures */
        #controls {
            position: absolute;
            bottom: 100px; /* Shifted up from 30px to avoid system bars */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 50;
        }

        #steer-track {
            width: 300px; height: 16px;
            background: rgba(0,0,0,0.2);
            border-radius: 20px; border: 4px solid rgba(255,255,255,0.4);
            position: relative;
        }

        #steer-handle {
            width: 50px; height: 50px;
            background: white; border-radius: 50%;
            position: absolute; top: -21px; left: 125px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid #999;
        }

        #pedal-container {
            display: flex; gap: 60px; width: 100%;
            justify-content: center;
        }

        .pedal {
            width: 100px; height: 120px;
            background: #f0f0f0; border-radius: 18px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-weight: 900; font-size: 16px;
            border: 2px solid #ccc;
            border-bottom: 8px solid #999;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            color: #333;
        }

        #gas-pedal { border-bottom-color: #2a9d8f; color: #2a9d8f; }
        #brake-pedal { border-bottom-color: #e63946; color: #e63946; }
        .pedal:active { transform: scale(0.95); border-bottom-width: 2px; margin-top: 6px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="stat-box">
            <span class="stat-label">Velocity</span>
            <span id="ui-speed" class="stat-value">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Coins</span>
            <span id="ui-coins" class="stat-value">0</span>
        </div>
        <div class="stat-box">
            <span class="stat-label">Distance</span>
            <span id="ui-dist" class="stat-value">0</span>
        </div>
    </div>

    <div id="start-screen" class="overlay">
        <h1>HIGHWAY DASH</h1>
        <p>A beautiful day for high-speed driving.<br>Use the lever to steer and GAS to accelerate.</p>
        <button class="btn" onclick="Engine.start()">DRIVE NOW</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1 style="color: #000;">ACCIDENT</h1>
        <p id="final-stats"></p>
        <button class="btn" onclick="Engine.start()">REPAIR CAR</button>
    </div>

    <div id="controls">
        <div id="steer-track">
            <div id="steer-handle"></div>
        </div>
        <div id="pedal-container">
            <div id="brake-pedal" class="pedal">BRAKE</div>
            <div id="gas-pedal" class="pedal">GAS</div>
        </div>
    </div>
</div>

<script>
/**
 * HIGHWAY DASH - Daylight Version
 */

const CONFIG = {
    ROAD_WIDTH: 380,
    LANE_COUNT: 4,
    MAX_SPEED: 16,
    ACCEL: 0.1,
    FRICTION: 0.04,
    BRAKE: 0.22,
    SPAWN_FREQ: 60,
    COLORS: {
        grass: '#58bc58',
        road: '#4a4a4a',
        player: '#e63946',
        truck: '#264653',
        sedan: '#f4a261',
        coin: '#ffcc00'
    }
};

const Input = {
    steer: 0, gas: false, brake: false,
    init() {
        const handle = document.getElementById('steer-handle');
        const track = document.getElementById('steer-track');
        const updateSteer = (clientX) => {
            const rect = track.getBoundingClientRect();
            let p = (clientX - rect.left) / rect.width;
            p = Math.max(0, Math.min(1, p));
            this.steer = (p - 0.5) * 2;
            handle.style.left = (p * rect.width - 25) + 'px';
        };
        window.addEventListener('pointermove', (e) => { if(e.buttons > 0) updateSteer(e.clientX); });
        document.getElementById('gas-pedal').onpointerdown = () => this.gas = true;
        document.getElementById('gas-pedal').onpointerup = () => this.gas = false;
        document.getElementById('brake-pedal').onpointerdown = () => this.brake = true;
        document.getElementById('brake-pedal').onpointerup = () => this.brake = false;
    }
};

class PlayerCar {
    constructor() {
        this.w = 46; this.h = 85; this.x = 0; this.y = 0; this.speed = 0;
        this.wheelRotation = 0;
    }
    update() {
        if (Input.gas) this.speed += CONFIG.ACCEL;
        else if (Input.brake) this.speed -= CONFIG.BRAKE;
        else this.speed -= CONFIG.FRICTION;
        this.speed = Math.max(0, Math.min(this.speed, CONFIG.MAX_SPEED));
        this.x += Input.steer * 8 * (this.speed / 10 + 0.3);
        const limit = (CONFIG.ROAD_WIDTH / 2) - 10;
        this.x = Math.max(-limit, Math.min(limit, this.x));
        this.wheelRotation += this.speed * 0.5;
    }
}

class NPC {
    constructor(lane, y) {
        this.w = 46; this.h = 85;
        this.x = (lane - 1.5) * (CONFIG.ROAD_WIDTH / CONFIG.LANE_COUNT);
        this.y = y;
        this.speed = 3 + Math.random() * 4;
        this.isTruck = Math.random() > 0.7;
        if(this.isTruck) { this.h = 140; this.color = CONFIG.COLORS.truck; }
        else { this.color = CONFIG.COLORS.sedan; }
    }
}

const Engine = {
    canvas: document.getElementById('gameCanvas'),
    ctx: null, player: new PlayerCar(),
    npcs: [], coins: [], nature: [],
    distance: 0, coinCount: 0, frame: 0, isRunning: false,

    start() {
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        Input.init();
        this.player = new PlayerCar();
        this.player.y = this.canvas.height - 250;
        this.npcs = []; this.coins = []; this.nature = [];
        this.distance = 0; this.coinCount = 0; this.isRunning = true;
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over').classList.add('hidden');
        if(!this.loopStarted) { this.loop(); this.loopStarted = true; }
    },

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    },

    spawn() {
        this.frame++;
        if (this.frame % CONFIG.SPAWN_FREQ === 0) {
            this.npcs.push(new NPC(Math.floor(Math.random() * 4), -200));
        }
        if (this.frame % 100 === 0) {
            this.coins.push({ x: (Math.random() - 0.5) * 300, y: -50 });
        }
        if (this.frame % 10 === 0) {
            this.nature.push({ 
                x: (Math.random() > 0.5 ? 1 : -1) * (260 + Math.random() * 300), 
                y: -100, size: 20 + Math.random() * 40, 
                col: ['#2d5a27', '#1e3d1a', '#ff99cc'][Math.floor(Math.random()*3)]
            });
        }
    },

    update() {
        if(!this.isRunning) return;
        this.player.update();
        this.distance += this.player.speed * 0.08;
        this.spawn();

        this.npcs.forEach((n, i) => {
            n.y += (n.speed - (this.player.speed * 0.4)); 
            if(this.checkHit(this.player, n)) this.gameOver();
            if(n.y > this.canvas.height + 200) this.npcs.splice(i, 1);
        });

        this.coins.forEach((c, i) => {
            c.y += this.player.speed;
            if(this.checkHit(this.player, {x:c.x, y:c.y, w:20, h:20})) {
                this.coinCount++; this.coins.splice(i, 1);
            }
            if(c.y > this.canvas.height) this.coins.splice(i, 1);
        });

        this.nature.forEach((n, i) => {
            n.y += this.player.speed;
            if(n.y > this.canvas.height + 100) this.nature.splice(i, 1);
        });

        document.getElementById('ui-speed').innerText = Math.floor(this.player.speed * 10);
        document.getElementById('ui-coins').innerText = this.coinCount;
        document.getElementById('ui-dist').innerText = Math.floor(this.distance);
    },

    checkHit(a, b) {
        const ax = a.x + this.canvas.width/2 - a.w/2;
        const bx = b.x + this.canvas.width/2 - b.w/2;
        return ax < bx + b.w && ax + a.w > bx && a.y < b.y + b.h && a.y + a.h > b.y;
    },

    draw() {
        const ctx = this.ctx; const cw = this.canvas.width; const ch = this.canvas.height;
        ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, cw, ch); // Sky
        ctx.fillStyle = CONFIG.COLORS.grass; ctx.fillRect(0, 0, cw, ch); // Ground

        // Road
        ctx.fillStyle = CONFIG.COLORS.road;
        ctx.fillRect(cw/2 - CONFIG.ROAD_WIDTH/2, 0, CONFIG.ROAD_WIDTH, ch);
        
        // Lines
        ctx.strokeStyle = '#fff'; ctx.setLineDash([30, 40]);
        ctx.lineDashOffset = -this.distance * 30;
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(cw/2, 0); ctx.lineTo(cw/2, ch); ctx.stroke();
        ctx.setLineDash([]); ctx.strokeStyle = '#f1f1f1';
        ctx.strokeRect(cw/2 - CONFIG.ROAD_WIDTH/2, -10, CONFIG.ROAD_WIDTH, ch + 20);

        // Nature
        this.nature.forEach(n => {
            ctx.fillStyle = n.col;
            ctx.beginPath(); ctx.arc(n.x + cw/2, n.y, n.size, 0, 7); ctx.fill();
        });

        // Coins
        ctx.fillStyle = CONFIG.COLORS.coin;
        this.coins.forEach(c => {
            ctx.beginPath(); ctx.arc(c.x + cw/2, c.y, 10, 0, 7); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.stroke();
        });

        // NPCs
        this.npcs.forEach(n => this.drawDetailedCar(n, n.color));

        // Player
        this.drawDetailedCar(this.player, CONFIG.COLORS.player, true);
    },

    drawDetailedCar(obj, color, isPlayer = false) {
        const ctx = this.ctx;
        const x = obj.x + this.canvas.width/2 - obj.w/2;
        const y = obj.y;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.2)';
        ctx.fillRect(x + 5, y + 5, obj.w, obj.h);

        // Body
        ctx.fillStyle = color;
        ctx.fillRect(x, y, obj.w, obj.h);

        // Windshield
        ctx.fillStyle = '#222';
        const windY = isPlayer ? y + 15 : y + obj.h - 35;
        ctx.fillRect(x + 5, windY, obj.w - 10, 20);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(x + 8, windY + 2, 10, 5); // Reflection

        // Wheels
        ctx.fillStyle = '#111';
        const wheelW = 8; const wheelH = 15;
        ctx.fillRect(x - 4, y + 10, wheelW, wheelH); // TL
        ctx.fillRect(x + obj.w - 4, y + 10, wheelW, wheelH); // TR
        ctx.fillRect(x - 4, y + obj.h - 25, wheelW, wheelH); // BL
        ctx.fillRect(x + obj.w - 4, y + obj.h - 25, wheelW, wheelH); // BR

        if(isPlayer) {
            // Spoiler
            ctx.fillStyle = '#900';
            ctx.fillRect(x - 2, y + obj.h - 5, obj.w + 4, 8);
            // Speed Lines
            if(obj.speed > 10) {
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.moveTo(x - 10, y + 50); ctx.lineTo(x - 10, y + 100);
                ctx.moveTo(x + obj.w + 10, y + 50); ctx.lineTo(x + obj.w + 10, y + 100);
                ctx.stroke();
            }
        }
    },

    gameOver() {
        this.isRunning = false;
        document.getElementById('final-stats').innerText = `Distance: ${Math.floor(this.distance)}m | Coins: ${this.coinCount}`;
        document.getElementById('game-over').classList.remove('hidden');
    },

    loop() {
        this.update(); this.draw();
        requestAnimationFrame(() => this.loop());
    }
};

window.addEventListener('resize', () => Engine.resize());
</script>
</body>
</html>
