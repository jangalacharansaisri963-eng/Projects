<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Highway Dash: Pro Edition</title>
    <style>
        :root {
            --sky: #a2d2ff;
            --grass: #70e000;
            --asphalt: #333533;
            --stripe: #ffffff;
            --player: #d90429;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            user-select: none;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--sky);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        canvas { display: block; }

        /* UI HUD - High Visibility */
        #hud {
            position: absolute;
            top: 50px; left: 20px; right: 20px;
            display: flex; justify-content: space-between;
            pointer-events: none; z-index: 10;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 15px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center; min-width: 80px;
            border-bottom: 3px solid #ddd;
        }

        .label { font-size: 10px; color: #666; text-transform: uppercase; font-weight: 800; }
        .value { font-size: 20px; font-weight: 900; color: #111; display: block; }

        /* Overlays */
        .overlay {
            position: absolute; inset: 0;
            background: rgba(255, 255, 255, 0.9);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            z-index: 100; text-align: center; padding: 20px;
        }

        h1 { font-size: 40px; margin: 0; color: var(--player); font-weight: 900; letter-spacing: -1px; }
        .hidden { display: none !important; }

        .btn {
            padding: 18px 45px; font-size: 18px; font-weight: bold;
            background: #111; color: white; border: none;
            border-radius: 50px; cursor: pointer;
            box-shadow: 0 8px 0 #444; transition: 0.1s;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #444; }

        /* CONTROLS - Shifted Up for Mobile Safety */
        #ctrl-layer {
            position: absolute;
            bottom: 110px; /* High clearance for gesture bars */
            width: 100%; display: flex; flex-direction: column;
            align-items: center; gap: 30px; z-index: 50;
        }

        #steer-track {
            width: 75%; max-width: 320px; height: 12px;
            background: rgba(0,0,0,0.1); border-radius: 10px;
            border: 2px solid rgba(255,255,255,0.5); position: relative;
        }

        #steer-handle {
            width: 54px; height: 54px; background: white;
            border-radius: 50%; position: absolute; top: -23px; left: calc(50% - 27px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); border: 1px solid #ccc;
        }

        #pedals { display: flex; gap: 60px; }
        .pedal {
            width: 90px; height: 110px; background: #eee;
            border-radius: 20px; border: 2px solid #ccc;
            border-bottom: 8px solid #bbb;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: #444; font-size: 14px;
        }
        #gas { border-bottom-color: #38b000; color: #38b000; }
        #brake { border-bottom-color: #d00000; color: #d00000; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
        <div class="stat-card"><span class="label">Speed</span><span id="ui-spd" class="value">0</span></div>
        <div class="stat-card"><span class="label">Coins</span><span id="ui-coin" class="value">0</span></div>
        <div class="stat-card"><span class="label">Dist</span><span id="ui-dst" class="value">0</span></div>
    </div>

    <div id="start-screen" class="overlay">
        <h1>HIGHWAY DASH</h1>
        <p>Two-Way Traffic! Watch out for oncoming cars.<br>Hold GAS to move, steer with the LEVER.</p>
        <button class="btn" onclick="Engine.start()">START DRIVING</button>
    </div>

    <div id="game-over" class="overlay hidden">
        <h1>WRECKED!</h1>
        <p id="results"></p>
        <button class="btn" onclick="Engine.start()">REPAIR CAR</button>
    </div>

    <div id="ctrl-layer">
        <div id="steer-track"><div id="steer-handle"></div></div>
        <div id="pedals">
            <div id="brake" class="pedal">BRAKE</div>
            <div id="gas" class="pedal">GAS</div>
        </div>
    </div>
</div>

<script>
/**
 * HIGHWAY DASH - Professional Smooth Implementation
 */

const CONFIG = {
    ROAD_W: 400,
    LANE_W: 100,
    PLAYER_MAX_SPD: 12, // Reduced for better control
    ACCEL: 0.08,
    FRICTION: 0.03,
    BRAKE: 0.3,
    GRAVITY: 0.5,
    SPAWN_DIST: 800,
    MAGNET_RANGE: 150
};

const Utils = {
    lerp: (a, b, t) => a + (b - a) * t,
    clamp: (v, min, max) => Math.max(min, Math.min(max, v))
};

const Input = {
    steer: 0, gas: false, brake: false,
    init() {
        const h = document.getElementById('steer-handle');
        const t = document.getElementById('steer-track');
        const move = (clientX) => {
            const rect = t.getBoundingClientRect();
            let p = Utils.clamp((clientX - rect.left) / rect.width, 0, 1);
            this.steer = (p - 0.5) * 2;
            h.style.left = `calc(${p * 100}% - 27px)`;
        };
        window.onpointermove = (e) => { if(e.buttons > 0) move(e.clientX); };
        document.getElementById('gas').onpointerdown = () => this.gas = true;
        document.getElementById('gas').onpointerup = () => this.gas = false;
        document.getElementById('brake').onpointerdown = () => this.brake = true;
        document.getElementById('brake').onpointerup = () => this.brake = false;
    }
};

class Entity {
    constructor(x, y, w, h) {
        this.x = x; this.y = y; this.w = w; this.h = h;
    }
}

class Car extends Entity {
    constructor(lane, y, speed, isPlayer = false) {
        super(0, y, 48, 90);
        this.lane = lane;
        this.speed = speed;
        this.isPlayer = isPlayer;
        this.color = isPlayer ? '#d90429' : ['#2b2d42', '#8d99ae', '#fb8500'][Math.floor(Math.random()*3)];
        this.oncoming = !isPlayer && lane < 2; // Left 2 lanes are oncoming
        this.targetX = (lane - 1.5) * CONFIG.LANE_W;
        this.x = this.targetX;
    }
}

const Engine = {
    canvas: document.getElementById('gameCanvas'),
    ctx: null,
    player: null,
    entities: [],
    nature: [],
    coins: [],
    distance: 0,
    coinCount: 0,
    isRunning: false,
    lastTime: 0,

    start() {
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        Input.init();
        this.player = new Car(2.5, 0, 0, true);
        this.player.y = this.canvas.height - 250;
        this.entities = [];
        this.nature = [];
        this.coins = [];
        this.distance = 0;
        this.coinCount = 0;
        this.isRunning = true;
        this.lastTime = performance.now();

        document.querySelectorAll('.overlay').forEach(e => e.classList.add('hidden'));
        if(!this.loopStarted) { this.loop(performance.now()); this.loopStarted = true; }
    },

    resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    },

    spawn(dt) {
        if (Math.random() < 0.02) {
            const lane = Math.floor(Math.random() * 4);
            // Oncoming cars move down (- speed), same-way move up (+ speed)
            const speed = (lane < 2) ? (3 + Math.random() * 5) : (1 + Math.random() * 3);
            this.entities.push(new Car(lane, -200, speed));
        }
        if (Math.random() < 0.01) {
            this.coins.push({ x: (Math.random()-0.5) * 350, y: -100, w: 20, h: 20 });
        }
        if (Math.random() < 0.05) {
            this.nature.push({
                x: (Math.random() > 0.5 ? 1 : -1) * (250 + Math.random() * 300),
                y: -100,
                s: 20 + Math.random() * 40,
                c: ['#2d6a4f', '#40916c', '#ff99ac'][Math.floor(Math.random()*3)]
            });
        }
    },

    update(dt) {
        if (!this.isRunning) return;

        // Smooth Physics for Player
        const p = this.player;
        if (Input.gas) p.speed += CONFIG.ACCEL;
        else if (Input.brake) p.speed -= CONFIG.BRAKE;
        else p.speed -= CONFIG.FRICTION;
        p.speed = Utils.clamp(p.speed, 0, CONFIG.PLAYER_MAX_SPD);

        // Smooth Steering
        const steerTarget = Input.steer * (CONFIG.ROAD_W/2 - 25);
        p.x = Utils.lerp(p.x, steerTarget, 0.1); 

        this.distance += p.speed * 0.1;
        this.spawn(dt);

        // Update Traffic
        this.entities.forEach((n, i) => {
            // If oncoming, they fly past much faster
            const relSpeed = n.oncoming ? (n.speed + p.speed) : (p.speed - n.speed);
            n.y += relSpeed;

            // Simple Box Collision
            if (this.checkCollision(p, n)) this.end();
            if (n.y > this.canvas.height + 200 || n.y < -500) this.entities.splice(i, 1);
        });

        // Update Coins with Magnetism
        this.coins.forEach((c, i) => {
            const dist = Math.hypot((p.x + this.canvas.width/2) - (c.x + this.canvas.width/2), p.y - c.y);
            
            if (dist < CONFIG.MAGNET_RANGE) {
                // Magnet effect: fly to player
                c.x = Utils.lerp(c.x, p.x, 0.2);
                c.y = Utils.lerp(c.y, p.y, 0.2);
            } else {
                c.y += p.speed;
            }

            if (dist < 40) {
                this.coinCount++;
                this.coins.splice(i, 1);
            }
            if (c.y > this.canvas.height) this.coins.splice(i, 1);
        });

        this.nature.forEach((n, i) => {
            n.y += p.speed;
            if (n.y > this.canvas.height + 100) this.nature.splice(i, 1);
        });

        // Update UI
        document.getElementById('ui-spd').innerText = Math.floor(p.speed * 15);
        document.getElementById('ui-coin').innerText = this.coinCount;
        document.getElementById('ui-dst').innerText = Math.floor(this.distance);
    },

    checkCollision(p, n) {
        const px = p.x + this.canvas.width/2 - p.w/2;
        const nx = n.x + this.canvas.width/2 - n.w/2;
        return px < nx + n.w && px + p.w > nx && p.y < n.y + n.h && p.y + p.h > n.y;
    },

    draw() {
        const ctx = this.ctx; const cw = this.canvas.width; const ch = this.canvas.height;
        
        // Scene
        ctx.fillStyle = '#a2d2ff'; ctx.fillRect(0,0,cw,ch);
        ctx.fillStyle = '#70e000'; ctx.fillRect(0,0,cw,ch);

        // Road
        ctx.fillStyle = '#333533';
        ctx.fillRect(cw/2 - CONFIG.ROAD_W/2, 0, CONFIG.ROAD_W, ch);

        // Divider (Yellow Median)
        ctx.fillStyle = '#ffb703';
        ctx.fillRect(cw/2 - 4, 0, 8, ch);

        // Lane lines (White Dash)
        ctx.strokeStyle = '#fff'; ctx.setLineDash([20, 30]);
        ctx.lineDashOffset = -this.distance * 10;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cw/2 - 100, 0); ctx.lineTo(cw/2 - 100, ch);
        ctx.moveTo(cw/2 + 100, 0); ctx.lineTo(cw/2 + 100, ch);
        ctx.stroke();

        // Draw Items
        this.nature.forEach(n => {
            ctx.fillStyle = n.c;
            ctx.beginPath(); ctx.arc(n.x + cw/2, n.y, n.s, 0, 7); ctx.fill();
        });

        this.coins.forEach(c => {
            ctx.fillStyle = '#ffb703';
            ctx.beginPath(); ctx.arc(c.x + cw/2, c.y, 10, 0, 7); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        });

        this.entities.forEach(n => this.drawCar(n));
        this.drawCar(this.player);
    },

    drawCar(car) {
        const ctx = this.ctx;
        const x = car.x + this.canvas.width/2 - car.w/2;
        const y = car.y;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(x + 6, y + 6, car.w, car.h);

        // Body
        ctx.fillStyle = car.color;
        ctx.fillRect(x, y, car.w, car.h);

        // Design: Windshield
        ctx.fillStyle = car.oncoming ? '#333' : '#eee';
        const windY = car.oncoming ? y + car.h - 30 : y + 10;
        ctx.fillRect(x + 4, windY, car.w - 8, 20);

        // Lights
        ctx.fillStyle = car.oncoming ? 'yellow' : 'red';
        const lightY = car.oncoming ? y : y + car.h - 5;
        ctx.fillRect(x + 5, lightY, 10, 5);
        ctx.fillRect(x + car.w - 15, lightY, 10, 5);
    },

    end() {
        this.isRunning = false;
        document.getElementById('results').innerText = `Distance: ${Math.floor(this.distance)}m | Coins: ${this.coinCount}`;
        document.getElementById('game-over').classList.remove('hidden');
    },

    loop(t) {
        const dt = (t - this.lastTime) / 16;
        this.lastTime = t;
        this.update(dt);
        this.draw();
        requestAnimationFrame((t) => this.loop(t));
    }
};

window.onresize = () => Engine.resize();
window.onload = () => Engine.start();
</script>
</body>
</html>
